ning": "Nice to meet you / Hope we get along!", "tip_tl": "Kaswal na bati sa kapwa estudyante o kaklase. Ang 'ne' sa dulo ay nagbibigay ng friendly at maamong boses.", "chunks": ["よろしくね！"], "options": ["よろしくね！", "よろしく おねがいします。", "ごちそうさま！"], "correct": 0, "unit": 1}, {"id": "s2_u01_q03", "target_ja": "はじめまして、ケンです。", "romaji": "Hajimemashite, Ken desu.", "tl_meaning": "Nice to meet you, ako si Ken.", "en_meaning": "Nice to meet you, I'm Ken.", "tip_tl": "Simpleteng pagpapakilala ng pangalan sa bagong kaklase. Pwedeng gamitin ang 'desu' para maging maayos at katamtamang galang.", "chunks": ["はじめまして、", "ケンです。"], "options": ["はじめまして、ケンです。", "はじめまして、ケンでした。", "ただいま、ケンです。"], "correct": 0, "unit": 1}, {"id": "s2_u01_q04", "target_ja": "なにってよべばいい？", "romaji": "Nani tte yobeba ii?", "tl_meaning": "Anong pwede kong itawag sa'yo?", "en_meaning": "What should I call you?", "tip_tl": "Pagtatanong ng nickname sa bagong kaklase sa classroom. Napakagandang paraan para mabilis kayong maging close.", "chunks": ["なにって", "よべば", "いい？"], "options": ["なにってよべばいい？", "なにをつくればいい？", "どこへいけばいい？"], "correct": 0, "unit": 1}, {"id": "s2_u01_q05", "target_ja": "マリアってよんでね。", "romaji": "Maria tte yonde ne.", "tl_meaning": "Tawagin mo na lang akong Maria.", "en_meaning": "Just call me Maria.", "tip_tl": "Pagsagot kapag tinanong ka ng kaklase kung ano ang tawag sa'yo. Mas madaling makipagkaibigan kapag may maikling nickname.", "chunks": ["マリアって", "よんでね。"], "options": ["マリアってよんでね。", "マリアってかいてね。", "マリアってきいてね。"], "correct": 0, "unit": 1}, {"id": "s2_u01_q06", "target_ja": "おなじクラスだね、よろしく！", "romaji": "Onaji kurasu dane, yoroshiku!", "tl_meaning": "Magkakaklase pala tayo, nice meeting you!", "en_meaning": "We're in the same class, nice to meet you!", "tip_tl": "Malaman mong nasa iisang homeroom kayo ng bago mong kakilala. Gamitin ang 'onaji kurasu' (same class) para mas maging natural.", "chunks": ["おなじ", "クラスだね、", "よろしく！"], "options": ["おなじクラスだね、よろしく！", "おなじがっこうでした、さようなら！", "ちがうクラスだね、おめでとう！"], "correct": 0, "unit": 1}, {"id": "s2_u01_q07", "target_ja": "となりのせき、いい？", "romaji": "Tonari no seki, ii?", "tl_meaning": "Pwede bang umupo sa tabi mo?", "en_meaning": "Is it okay if I sit next to you?", "tip_tl": "Pagtatanong bago umupo sa bakanteng upuan sa tabi ng bagong kaklase. Ang 'tonari' ay tabi, at 'seki' ay upuan.", "chunks": ["となりの", "せき、", "いい？"], "options": ["となりのせき、いい？", "となりのへや、どこ？", "となりのひと、だれ？"], "correct": 0, "unit": 1}, {"id": "s2_u01_q08", "target_ja": "うん、どうぞ！よろしくね。", "romaji": "Un, douzo! Yoroshiku ne.", "tl_meaning": "Oo naman, sige lang! Nice to meet you.", "en_meaning": "Yeah, sure! Nice meeting you.", "tip_tl": "Pagsagot nang masaya kapag may gustong umupo sa tabi mo sa classroom. Ang 'un' ay kaswal na 'o'o (yes).", "chunks": ["うん、", "どうぞ！", "よろしくね。"], "options": ["うん、どうぞ！よろしくね。", "いいえ、だめ！すみません。", "はい、おつかれさまでした！"], "correct": 0, "unit": 1}, {"id": "s2_u01_q09", "target_ja": "はじめまして。せんせい、よろしくおねがいします。", "romaji": "Hajimemashite. Sensei, yoroshiku onegaishimasu.", "tl_meaning": "Nice to meet you po. Teacher, I look forward to your class.", "en_meaning": "Nice to meet you. Teacher, I look forward to learning from you.", "tip_tl": "Pagpapakilala sa bagong adviser o subject teacher. Kapag guro ang kausap, kailangang gamitin ang pormal na 'yoroshiku onegaishimasu'.", "chunks": ["はじめまして。", "せんせい、", "よろしく", "おねがいします。"], "options": ["はじめまして。せんせい、よろしくおねがいします。", "はじめまして。せんせい、よろしくね！", "おすっ！せんせい、じゃあね！"], "correct": 0, "unit": 1}, {"id": "s2_u01_q10", "target_ja": "こちらこそ、よろしくね！なんでもきいてね。", "romaji": "Kochirakoso, yoroshiku ne! Nandemo kiite ne.", "tl_meaning": "Ako rin, nice to meet you! Magtanong ka lang kung may kailangan ka.", "en_meaning": "Likewise, nice to meet you! Feel free to ask me anything.", "tip_tl": "Mabait na sagot ng kapwa kaklase sa'yo. Ang 'nandemo kiite ne' ay nangangahulugang ready siyang tumulong sa mga leksyon.", "chunks": ["こちらこそ、", "よろしくね！", "なんでも", "きいてね。"], "options": ["こちらこそ、よろしくね！なんでもきいてね。", "こちらこそ、ごめんなさい！なにもしらないよ。", "はじめまして、さようなら！しずかにしてね。"], "correct": 0, "unit": 1}, {"id": "s2_u01_q11", "target_ja": "ぶかつ、なににはいる？", "romaji": "Bukatsu, nani ni hairu?", "tl_meaning": "Anong club / bukatsu ang sasalihan mo?", "en_meaning": "What school club are you going to join?", "tip_tl": "Usapan sa unang linggo ng klase tungkol sa pagpili ng club (sports o arts). Napakasikat na paksa nito sa mga Japanese High School.", "chunks": ["ぶかつ、", "なにに", "はいる？"], "options": ["ぶかつ、なににはいる？", "ぶかつ、どこでかう？", "ぶかつ、なにをたべる？"], "correct": 0, "unit": 1}, {"id": "s2_u01_q12", "target_ja": "はじめまして！みんな、よろしくおねがいします！", "romaji": "Hajimemashite! Minna, yoroshiku onegaishimasu!", "tl_meaning": "Nice to meet you everyone! I hope we all get along well!", "en_meaning": "Nice to meet you all! I look forward to being in this class with everyone!", "tip_tl": "Pagpapakilala sa harap ng buong klase sa unang araw ng eskwela. Ang 'minna' ay nangangahulugang 'lahat / everyone'.", "chunks": ["はじめまして！", "みんな、", "よろしく", "おねがいします！"], "options": ["はじめまして！みんな、よろしくおねがいします！", "はじめまして！みんな、おつかれさまでした！", "さようなら！みんな、しつれいします！"], "correct": 0, "unit": 1}, {"id": "s2_u02_q01", "target_ja": "こうこういちねんせいです。", "romaji": "Koukou ichinensei desu.", "tl_meaning": "Grade 10 / 1st year high school ako.", "en_meaning": "I am a 1st year high school student (10th grade).", "tip_tl": "Pagsasabi ng grade level sa bagong kaklase sa school. Sa Japan, ang High School ay may Grade 1 hanggang 3.", "chunks": ["こうこう", "いちねんせい", "です。"], "options": ["こうこういちねんせいです。", "こうこういちねんせいをします。", "こうこういちねんせいでした。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q02", "target_ja": "マニラからきました。", "romaji": "Manira kara kimashita.", "tl_meaning": "Galing ako sa Maynila.", "en_meaning": "I came from Manila.", "tip_tl": "Pagbabahagi kung saang lugar o lungsod ka galing. Ang 'kara kimashita' ay nangangahulugang galing o nagmula sa nasabing lugar.", "chunks": ["マニラから", "きました。"], "options": ["マニラからきました。", "マニラへいきます。", "マニラにすみます。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q03", "target_ja": "ゲームがすきです。", "romaji": "Geemu ga suki desu.", "tl_meaning": "Gusto ko / Mahilig ako sa video games.", "en_meaning": "I like video games.", "tip_tl": "Pagkukuwento ng hobby sa mga bagong kaibigan sa classroom. Napakadaling paraan para makahanap ng kalaro sa online games.", "chunks": ["ゲームが", "すきです。"], "options": ["ゲームがすきです。", "ゲームをたべます。", "ゲームにいきます。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q04", "target_ja": "すきなかもくはえいごです。", "romaji": "Sukina kamoku wa eigo desu.", "tl_meaning": "Ang paborito kong subject ay English.", "en_meaning": "My favorite subject is English.", "tip_tl": "Tanungan sa klase tungkol sa paboritong aralin. Ang 'kamoku' ay subject sa eskwelahan tulad ng English o Math.", "chunks": ["すきな", "かもくは", "えいごです。"], "options": ["すきなかもくはえいごです。", "すきなかもくをえいごです。", "すきなかもくがえいごをします。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q05", "target_ja": "バスケぶにはいりたいです。", "romaji": "Basukebu ni hairitai desu.", "tl_meaning": "Gusto kong sumali sa basketball club.", "en_meaning": "I want to join the basketball club.", "tip_tl": "Pakikipag-usap sa orientation tungkol sa club activities (bukatsu). Gamitin ang 'hairitai desu' para sabihing nais mong sumali.", "chunks": ["バスケぶに", "はいりたいです。"], "options": ["バスケぶにはいりたいです。", "バスケぶをはいります。", "バスケぶへはいりません。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q06", "target_ja": "おんがくをきくのがすきです。", "romaji": "Ongaku wo kiku no ga suki desu.", "tl_meaning": "Mahilig akong makinig ng musika.", "en_meaning": "I like listening to music.", "tip_tl": "Pagpapakilala ng hilig gawin sa libreng oras. Ang 'kiku no ga suki' ay nagpapakita ng pagkagusto sa pakikinig.", "chunks": ["おんがくを", "きくのが", "すきです。"], "options": ["おんがくをきくのがすきです。", "おんがくをきくのがきらいです。", "おんがくをみるのがすきです。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q07", "target_ja": "すうがくはちょっとにがてです。", "romaji": "Suugaku wa chotto nigate desu.", "tl_meaning": "Medyo mahina / hindi ako masyadong magaling sa Math.", "en_meaning": "I'm a bit weak at math.", "tip_tl": "Tapat na pag-amin sa kaklase habang nag-aaral. Ang 'nigate' ay natural na salita para sa bagay na nahihirapan ka.", "chunks": ["すうがくは", "ちょっと", "にがてです。"], "options": ["すうがくはちょっとにがてです。", "すうがくはちょっとじょうずです。", "すうがくはとてもすきです。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q08", "target_ja": "きゅうじつはなにをしてる？", "romaji": "Kyuujitsu wa nani wo shiteru?", "tl_meaning": "Anong ginagawa mo tuwing weekend / walang pasok?", "en_meaning": "What do you do on weekends/days off?", "tip_tl": "Pagtatanong sa kaklase habang lunch break para mas makilala siya. Kaswal at magaan itong itanong sa kaibigan.", "chunks": ["きゅうじつは", "なにを", "してる？"], "options": ["きゅうじつはなにをしてる？", "きゅうじつはどこにいきました？", "きゅうじつはだれとあいました？"], "correct": 0, "unit": 2}, {"id": "s2_u02_q09", "target_ja": "アニメをよくみます。", "romaji": "Anime wo yoku mimasu.", "tl_meaning": "Madalas akong manood ng anime.", "en_meaning": "I often watch anime.", "tip_tl": "Pagsagot tungkol sa hilig panoorin sa bahay. Ang 'yoku' dito ay nangangahulugang 'madalas' o 'often'.", "chunks": ["アニメを", "よく", "みます。"], "options": ["アニメをよくみます。", "アニメをあまりみません。", "アニメをぜんぜんみません。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q10", "target_ja": "ギターをれんしゅうしています。", "romaji": "Gitaa wo renshuu shiteimasu.", "tl_meaning": "Nag-eensayo / nagpa-practice ako mag-gitara.", "en_meaning": "I am practicing the guitar.", "tip_tl": "Pagkukuwento ng tinutugtog na instrumento o sinasalihang music club. Nagpapakita ito ng kasalukuyang ginagawang practice.", "chunks": ["ギターを", "れんしゅう", "しています。"], "options": ["ギターをれんしゅうしています。", "ギターをべんきょうしています。", "ギターをそうじしています。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q11", "target_ja": "タガログごとえいごがはなせます。", "romaji": "Tagarogugo to eigo ga hanasemasu.", "tl_meaning": "Nakakapagsalita ako ng Tagalog at English.", "en_meaning": "I can speak Tagalog and English.", "tip_tl": "Pagsasabi ng mga wikang alam mo sa klase. Ang 'hanasemasu' ay potential form na ibig sabihin ay kayang magsalita.", "chunks": ["タガログごと", "えいごが", "はなせます。"], "options": ["タガログごとえいごがはなせます。", "タガログごとえいごをはなします。", "タガログごとえいごがきこえます。"], "correct": 0, "unit": 2}, {"id": "s2_u02_q12", "target_ja": "にほんごはべんきょうちゅうです！", "romaji": "Nihongo wa benkyouchuu desu!", "tl_meaning": "Kasalukuyan pa akong nag-aaral ng Japanese!", "en_meaning": "I am currently studying Japanese!", "tip_tl": "Pagpapakumbaba sa harap ng buong klase o guro sa unang presentation. Ang 'chuu' (ちゅう) ay nangangahulugang 'currently in the middle of'.", "chunks": ["にほんごは", "べんきょうちゅう", "です！"], "options": ["にほんごはべんきょうちゅうです！", "にほんごはおわりです！", "にほんごはわすれました！"], "correct": 0, "unit": 2}, {"id": "s2_u03_q01", "target_ja": "よにんかぞくです。", "romaji": "Yonin kazoku desu.", "tl_meaning": "Apat kami sa pamilya.", "en_meaning": "We are a family of four.", "tip_tl": "Kuwentuhan sa classroom tungkol sa pamilya. Ang 'yonin' ay apat na tao, tandaan na hindi ito sinasabing 'yonnin' o 'shinin'.", "chunks": ["よにん", "かぞくです。"], "options": ["よにんかぞくです。", "よんにんかぞくです。", "しにんかぞくです。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q02", "target_ja": "おとうとがいます。", "romaji": "Otouto ga imasu.", "tl_meaning": "Mayroon akong nakababatang kapatid na lalaki.", "en_meaning": "I have a younger brother.", "tip_tl": "Pagpapakilala ng mga kapatid sa bagong kaibigan. Ang 'otouto' ay nakababatang kapatid na lalaki, huwag kalimutan ang mahabang tunog sa 'tou'.", "chunks": ["おとうとが", "います。"], "options": ["おとうとがいます。", "おとうとがあります。", "おとうとをいます。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q03", "target_ja": "おねえちゃんがふたりいます。", "romaji": "Oneechan ga futari imasu.", "tl_meaning": "May dalawa akong ate.", "en_meaning": "I have two older sisters.", "tip_tl": "Pakikipag-usap sa kaibigan sa klase habang break time. Ang 'oneechan' ay kaswal at magiliw na tawag sa ate, at 'futari' ang gamit para sa dalawang tao.", "chunks": ["おねえちゃんが", "ふたり", "います。"], "options": ["おねえちゃんがふたりいます。", "おねえちゃんがににんいます。", "おねえちゃんがふたつあります。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q04", "target_ja": "お父さんは日本にいます。", "romaji": "Otousan wa Nihon ni imasu.", "tl_meaning": "Ang tatay ko ay nasa Japan.", "en_meaning": "My father is in Japan.", "tip_tl": "Paliwanag sa kaklase kung nasaan ang mga magulang. Kapag pormal o maayos ang usapan, magandang gamitin ang 'Otousan' para sa sariling ama.", "chunks": ["お父さんは", "日本に", "います。"], "options": ["お父さんは日本にいます。", "お父さんは日本にあります。", "お父さんは日本をいます。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q05", "target_ja": "お母さんはフィリピン人です。", "romaji": "Okaasan wa Firipinjin desu.", "tl_meaning": "Ang nanay ko ay Pilipina.", "en_meaning": "My mother is Filipino.", "tip_tl": "Pagkukuwento sa kaibigan tungkol sa background ng pamilya. Ang 'Firipinjin' ay nangangahulugang mamamayan ng Pilipinas.", "chunks": ["お母さんは", "フィリピン人です。"], "options": ["お母さんはフィリピン人です。", "お母さんはフィリピン人がすきです。", "お母さんはフィリピン人にいきます。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q06", "target_ja": "日本におじいちゃんが住んでいます。", "romaji": "Nihon ni ojiichan ga sundeimasu.", "tl_meaning": "Nakatira ang lolo ko sa Japan.", "en_meaning": "My grandfather lives in Japan.", "tip_tl": "Pagbabahagi sa guro o kaklase tungkol sa mga kamag-anak sa Japan. Ang 'sundeimasu' ay kasalukuyang nakatira doon.", "chunks": ["日本に", "おじいちゃんが", "住んでいます。"], "options": ["日本におじいちゃんが住んでいます。", "日本におじいちゃんが住みます。", "日本におじいちゃんがいますでした。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q07", "target_ja": "東京にいとこがいます。", "romaji": "Tokyo ni itoko ga imasu.", "tl_meaning": "May pinsan ako sa Tokyo.", "en_meaning": "I have a cousin in Tokyo.", "tip_tl": "Usapan tungkol sa mga kamag-anak sa Japan. Ang 'itoko' ay pinsan, parehong gamit para sa lalaki o babae.", "chunks": ["東京に", "いとこが", "います。"], "options": ["東京にいとこがいます。", "東京にいとこがあります。", "東京にいとこが住みますでした。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q08", "target_ja": "ペットに犬がいます。", "romaji": "Petto ni inu ga imasu.", "tl_meaning": "May aso kami bilang pet.", "en_meaning": "We have a dog as a pet.", "tip_tl": "Ipinapakita ang litrato ng pamilya sa Messenger. Ang mga alagang hayop tulad ng 'inu' (aso) ay itinuturing ding bahagi ng pamilya kaya 'imasu' ang gamit.", "chunks": ["ペットに", "犬が", "います。"], "options": ["ペットに犬がいます。", "ペットに犬があります。", "ペットに犬をします。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q09", "target_ja": "お兄ちゃんは大学生です。", "romaji": "Oniichan wa daigakusei desu.", "tl_meaning": "College student na ang kuya ko.", "en_meaning": "My older brother is a college student.", "tip_tl": "Pagkukuwento sa kaibigan tungkol sa ginagawa ng nakatatandang kapatid. Ang 'daigakusei' ay estudyante sa kolehiyo.", "chunks": ["お兄ちゃんは", "大学生です。"], "options": ["お兄ちゃんは大学生です。", "お兄ちゃんは大学です。", "お兄ちゃんは高校生でしたです。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q10", "target_ja": "私は三人きょうだいの真ん中。", "romaji": "Watashi wa sannin kyoudai no mannaka.", "tl_meaning": "Pangatlo kami sa magkakapatid at ako ang panggitna (middle child).", "en_meaning": "I am the middle child of three siblings.", "tip_tl": "Kaswal na usapan kasama ang mga seatmates. Ang 'mannaka' ay nangangahulugang nasa gitna ng pagkakasunod-sunod.", "chunks": ["私は", "三人きょうだいの", "真ん中。"], "options": ["私は三人きょうだいの真ん中。", "私は三人きょうだいのまんなかですでした。", "私は三人きょうだいのあいだ。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q11", "target_ja": "来年、日本の親戚に会いに行きます。", "romaji": "Rainen, Nihon no shinseki ni ai ni ikimasu.", "tl_meaning": "Sa susunod na taon, pupunta ako sa Japan para bisitahin ang mga kamag-anak ko.", "en_meaning": "Next year, I am going to Japan to visit my relatives.", "tip_tl": "Pagkukuwento sa guro tungkol sa plano tuwing bakasyon. Ang 'shinseki' ay pangkalahatang tawag sa mga kamag-anak (relatives).", "chunks": ["来年、", "日本の親戚に", "会いに行きます。"], "options": ["来年、日本の親戚に会いに行きます。", "来年、日本の親戚に会いにきます。", "来年、日本の親戚に会うに行きます。"], "correct": 0, "unit": 3}, {"id": "s2_u03_q12", "target_ja": "家族みんな仲がいいです。", "romaji": "Kazoku minna naka ga ii desu.", "tl_meaning": "Sundo-sundo at close kaming lahat sa pamilya.", "en_meaning": "My family all get along very well.", "tip_tl": "Masayang pagbabahagi tungkol sa pamilya sa isang homeroom presentation. Ang 'naka ga ii' ay maganda ang relasyon o malapit sa isa't isa.", "chunks": ["家族", "みんな", "仲がいいです。"], "options": ["家族みんな仲がいいです。", "家族みんな仲をいいです。", "家族みんな友達がいいです。"], "correct": 0, "unit": 3}, {"id": "s2_u04_q01", "target_ja": "じゅうななさいです。", "romaji": "Juunanasai desu.", "tl_meaning": "Labimpitong taong gulang ako.", "en_meaning": "I am 17 years old.", "tip_tl": "Pakikipag-usap sa bagong kaklase sa classroom. Ang edad na 17 ay binibigkas na 'juunana' at hindi 'juushichi' kapag pansariling pagpapakilala.", "chunks": ["じゅうななさい", "です。"], "options": ["じゅうななさいです。", "じゅうななさいをします。", "じゅうななさいでした。"], "correct": 0, "unit": 4}, {"id": "s2_u04_q02", "target_ja": "なんさい？", "romaji": "Nansai?", "tl_meaning": "Ilang taon ka na?", "en_meaning": "How old are you?", "tip_tl": "Kaswal na pagtatanong ng edad sa isang kapwa estudyante sa corridor. Huwag itong gagamitin sa guro o mas matanda dahil masyado itong kaswal.", "chunks": ["なんさい？"], "options": ["なんさい？", "おいくつですか？", "なんにんですか？"], "correct": 0, "unit": 4}, {"id": "s2_u04_q03", "target_ja": "こうこうにねんせいだよ。", "romaji": "Koukou ninensei dayo.", "tl_meaning": "Grade 11 / 2nd year high school ako.", "en_meaning": "I am a 2nd year high school student.", "tip_tl": "Kuwentuhan sa cafeteria kasama ang mga kaibigan. Ang 'dayo' sa dulo ay nagpapakita ng pagiging malapit at kaswal sa kausap.", "chunks": ["こうこうにねんせい", "だよ。"], "options": ["こうこうにねんせいだよ。", "こうこうにねんせいですお世話になります。", "こうこうにねんせいをします。"], "correct": 0, "unit": 4}, {"id": "s2_u04_q04", "target_ja": "たんじょうびはいつ？", "romaji": "Tanjoubi wa itsu?", "tl_meaning": "Kailan ang kaarawan mo?", "en_meaning": "When is your birthday?", "tip_tl": "Pagtatanong sa kaklase habang nag-uusap tungkol sa horoscope o party. Masarap itong itanong para malaman kung kailan magreregalo.", "chunks": ["たんじょうびは", "いつ？"], "options": ["たんじょうびはいつ？", "たんじょうびはどこ？", "たんじょうびはだれ？"], "correct": 0, "unit": 4}, {"id": "s2_u04_q05", "target_ja": "はちがつじゅういちにちだよ。", "romaji": "Hachigatsu juuiichinichi dayo.", "tl_meaning": "Agosto 11 ang birthday ko.", "en_meaning": "It's August 11th.", "tip_tl": "Pagsagot sa kaklase tungkol sa iyong kaarawan. Ang 'hachigatsu' ay Agosto, at ang araw ay binabanggit kasunod nito.", "chunks": ["はちがつ", "じゅういちにち", "だよ。"], "options": ["はちがつじゅういちにちだよ。", "はちがつじゅういちにちをします。", "はちがつじゅういちにちでした。"], "correct": 0, "unit": 4}, {"id": "s2_u04_q06", "target_ja": "でんわばんごうをおしえて！", "romaji": "Denwa bangou wo oshiete!", "tl_meaning": "Pahingi naman ng phone number mo!", "en_meaning": "Can you give me your phone number?", "tip_tl": "Pakikipagpalitan ng contact info sa bagong kaibigan sa club activity. Ang 'oshiete' ay kaswal na hiling na ibig sabihin ay ipaalam o sabihin.", "chunks": ["でんわばんごうを", "おしえて！"], "options": ["でんわばんごうをおしえて！", "でんわばんごうをみせて！", "でんわばんごうをきいて！"], "correct": 0, "unit": 4}, {"id": "s2_u04_q07", "target_ja": "ゼロハチゼロのいちにさんよんです。", "romaji": "Zerohachizero no ichinisanyon desu.", "tl_meaning": "Ito ay 080-1234...", "en_meaning": "It is 080-1234...", "tip_tl": "Pagsasabi ng numero ng telepono sa guro para sa emergency contact list. Ang 'no' ay ginagamit bilang dash o pause sa pagitan ng mga grupo ng numero.", "chunks": ["ゼロハチゼロの", "いちにさんよんです。"], "options": ["ゼロハチゼロのいちにさんよんです。", "ゼロハチゼロのいちにさんよんをします。", "ゼロハチゼロのいちにさんよんでした。"], "correct": 0, "unit": 4}, {"id": "s2_u04_q08", "target_ja": "クラスに男子がじゅうごにんいます。", "romaji": "Kurasu ni danshi ga juugonin imasu.", "tl_meaning": "May labinglimang lalaki sa aming klase.", "en_meaning": "There are 15 boys in our class.", "tip_tl": "Pagkukuwento sa kaibigan tungkol sa profile ng homeroom class. Ang 'danshi' ay tumutukoy sa mga lalaking estudyante at 'juugonin' para sa 15 tao.", "chunks": ["クラスに", "男子が", "じゅうごにん", "います。"], "options": ["クラスに男子がじゅうごにんいます。", "クラスに男子がじゅうごにんあります。", "クラスに男子をじゅうごにんします。"], "correct": 0, "unit": 4}, {"id": "s2_u04_q09", "target_ja": "テストで、きゅうじゅうてんをとった！", "romaji": "Tesuto de, kyuujuuten wo totta!", "tl_meaning": "Nakatanggap ako ng 90 points sa test!", "en_meaning": "I got 90 points on the test!", "tip_tl": "Masayang pagbabalita sa kaklase pagkatapos ibalik ang exam paper. Ang 'ten' ay puntos (points) at ang 'totta' ay nakuha o score.", "chunks": ["テストで、", "きゅうじゅうてんを", "とった！"], "options": ["テストで、きゅうじゅうてんをとった！", "テストで、きゅうじゅうてんをしました！", "テストで、きゅうじゅうてんをみた！"], "correct": 0, "unit": 4}, {"id": "s2_u04_q10", "target_ja": "せんせいは、おいくつですか？", "romaji": "Sensei wa, oikutsu desu ka?", "tl_meaning": "Ilang taon na po kayo, Teacher?", "en_meaning": "How old are you, Teacher?", "tip_tl": "Magalang na pagtatanong sa guro habang nagkakatuwaan pagkatapos ng klase. Ang 'oikutsu desu ka' ay ang magalang na bersyon ng 'nansai'.", "chunks": ["せんせいは、", "おいくつですか？"], "options": ["せんせいは、おいくつですか？", "せんせいは、なんさい？", "せんせいは、いくつある？"], "correct": 0, "unit": 4}, {"id": "s2_u04_q11", "target_ja": "もうすぐじゅうはっさいになります。", "romaji": "Mousugu juuhassai ni narimasu.", "tl_meaning": "Maglalabing-walo na ako sa lalong madaling panahon.", "en_meaning": "I will be 18 years old soon.", "tip_tl": "Pagkukuwento sa homeroom teacher tungkol sa darating na debut o kaarawan. Ang 'juuhassai' ay may maliit na 'tsu' (っ) kaya mag-ingat sa pagbigkas.", "chunks": ["もうすぐ", "じゅうはっさいに", "なります。"], "options": ["もうすぐじゅうはっさいになります。", "もうすぐじゅうはちさいになります。", "もうすぐじゅうはっさいをします。"], "correct": 0, "unit": 4}, {"id": "s2_u04_q12", "target_ja": "うちのチームは、ぜんいんでじゅうににんです。", "romaji": "Uchi no chiimu wa, zenin de juuninin desu.", "tl_meaning": "Labindalawa kaming lahat sa aming koponan.", "en_meaning": "There are 12 of us in total in our team.", "tip_tl": "Pagpapaliwanag sa manager ng sports club tungkol sa bilang ng miyembro. Ang 'zenin de' ay nangangahulugang 'sa kabuuan / all together'.", "chunks": ["うちのチームは、", "ぜんいんで", "じゅうににんです。"], "options": ["うちのチームは、ぜんいんでじゅうににんです。", "うちのチームは、ぜんいんでじゅうににんをします。", "うちのチームは、ぜんいんでじゅうににんでした。"], "correct": 0, "unit": 4}, {"id": "s2_u05_q01", "target_ja": "いまなんじ？", "romaji": "Ima nanji?", "tl_meaning": "Anong oras na?", "en_meaning": "What time is it now?", "tip_tl": "Pagtatanong ng oras sa kaklase sa pagitan ng magkakasunod na klase. Kaswal itong ekspresyon na pampamilyar.", "chunks": ["いま", "なんじ？"], "options": ["いまなんじ？", "いまなんじですか？", "いまなんにん？"], "correct": 0, "unit": 5}, {"id": "s2_u05_q02", "target_ja": "くじはんだよ。", "romaji": "Kuji han dayo.", "tl_meaning": "Alas-nuebe y medya na.", "en_meaning": "It is 9:30.", "tip_tl": "Pagsagot sa katabi mo kung anong oras na sa classroom. Ang 'han' ay nangangahulugang kalahating oras o 30 minutes.", "chunks": ["くじはん", "だよ。"], "options": ["くじはんだよ。", "きゅうじはんだよ。", "くじさんじゅっぷんですお世話になります。"], "correct": 0, "unit": 5}, {"id": "s2_u05_q03", "target_ja": "きょうは何曜日？", "romaji": "Kyou wa nanyoubi?", "tl_meaning": "Anong araw ngayon?", "en_meaning": "What day of the week is it today?", "tip_tl": "Pagtatanong sa kaibigan bago magpalit ng classroom para sa susunod na subject. Madalas itong gamitin sa araw-araw na school life.", "chunks": ["きょうは", "何曜日？"], "options": ["きょうは何曜日？", "きょうは何時？", "きょうは何日ですか？"], "correct": 0, "unit": 5}, {"id": "s2_u05_q04", "target_ja": "あしたは、テストがあるよ。", "romaji": "Ashita wa, tesuto ga aruyo.", "tl_meaning": "Bukas, mayroon tayong exam.", "en_meaning": "Tomorrow, we have a test.", "tip_tl": "Paalala sa kaklase habang naglalakad pauwi pagkatapos ng eskwela. Ang 'aru' ay ginagamit para sa mga event o aktibidad tulad ng test.", "chunks": ["あしたは、", "テストが", "あるよ。"], "options": ["あしたは、テストがあるよ。", "あしたは、テストがいますよ。", "あしたは、テストをしますお疲れ様でした。"], "correct": 0, "unit": 5}, {"id": "s2_u05_q05", "target_ja": "一じかんめは、すうがくだ。", "romaji": "Ichijikanme wa, suugaku da.", "tl_meaning": "Ang unang period / subject natin ay Math.", "en_meaning": "The first period is math.", "tip_tl": "Pagtingin sa time table kasama ang katabi sa upuan sa simula ng araw. Ang 'jikanme' ay ginagamit para sa bilang ng period sa eskwelahan.", "chunks": ["一じかんめは、", "すうがくだ。"], "options": ["一じかんめは、すうがくだ。", "一じかんめは、すうがくをしますお疲れ様です。", "一じかんめは、すうがくでした。"], "correct": 0, "unit": 5}, {"id": "s2_u05_q06", "target_ja": "ぶかつは、よじからだよ。", "romaji": "Bukatsu wa, yoji kara dayo.", "tl_meaning": "Ang club activities ay magsisimula sa alas-kwatro.", "en_meaning": "Club activities start from 4 o'clock.", "tip_tl": "Pagkukuwento sa kaibigan tungkol sa schedule pagkatapos ng klase. Tandaan na ang 4 o'clock ay 'yoji' at hindi 'yonji'.", "chunks": ["ぶかつは、", "よじから", "だよ。"], "options": ["ぶかつは、よじからだよ。", "ぶかつは、よんじからだよ。", "ぶかつは、しじからですよ。"], "correct": 0, "unit": 5}, {"id": "s2_u05_q07", "target_ja": "どようびは、がっこうが休みだよ。", "romaji": "Doyoubi wa, gakkou ga yasumi dayo.", "tl_meaning": "Kapag Sabado, walang pasok sa eskwelahan.", "en_meaning": "There is no school on Saturdays.", "tip_tl": "Kuwentuhan sa chat kasama ang kaklase tungkol sa weekend plans. Ang 'yasumi' ay nangangahulugang day off o walang pasok.", "chunks": ["どようびは、", "がっこうが", "休みだよ。"], "options": ["どようびは、がっこうが休みだよ。", "どようびは、がっこうを休みますお疲れ様です。", "どようびは、がっこうに休みます。"], "correct": 0, "unit": 5}, {"id": "s2_u05_q08", "target_ja": "なんじに、ぶかつがおわる？", "romaji": "Nanji ni, bukatsu ga owaru?", "tl_meaning": "Anong oras natatapos ang club activity niyo?", "en_meaning": "What time does club practice end?", "tip_tl": "Pagtatanong sa kaibigan para magka-idea kung pwede ba kayong sumabay pauwi. Ang 'owaru' ay nangangahulugang matatapos.", "chunks": ["なんじに、", "ぶかつが", "おわる？"], "options": ["なんじに、ぶかつがおわる？", "なんじに、ぶかつをおわりますか？", "なんじに、ぶかつをやめますか？"], "correct": 0, "unit": 5}, {"id": "s2_u05_q09", "target_ja": "ごじはんに、えきでまちあわせね。", "romaji": "Gojihan ni, eki de machiawase ne.", "tl_meaning": "Magkita tayo sa istasyon ng alas-singko y medya ha.", "en_meaning": "Let's meet up at the station at 5:30.", "tip_tl": "Paggawa ng plano sa Instagram/Messenger para sa lakad pagkatapos ng school. Ang 'machiawase' ay pagkikita sa isang napagkasunduang lugar.", "chunks": ["ごじはんに、", "えきで", "まちあわせね。"], "options": ["ごじはんに、えきでまちあわせね。", "ごじはんに、えきでお世話になりますね。", "ごじはんに、えきにいきますね。"], "correct": 0, "unit": 5}, {"id": "s2_u05_q10", "target_ja": "らいしゅうの、げつようびは休みですか？", "romaji": "Raishuu no, getsuyoubi wa yasumi desu ka?", "tl_meaning": "Holiday / Walang pasok po ba sa Lunes ng susunod na linggo?", "en_meaning": "Is next Monday a holiday?", "tip_tl": "Magalang na pagtatanong sa iyong adviser o teacher sa staff room. Gamitin ang 'desu ka' para sa pormal na pagtatanong sa guro.", "chunks": ["らいしゅうの、", "げつようびは", "休みですか？"], "options": ["らいしゅうの、げつようびは休みですか？", "らいしゅうの、げつようびは休みだよ？", "らいしゅうの、げつようびを休みますか？"], "correct": 0, "unit": 5}, {"id": "s2_u05_q11", "target_ja": "ひるやすみは、じゅうにじからだよ。", "romaji": "Hiruyasumi wa, juuniji kara dayo.", "tl_meaning": "Ang lunch break ay magsisimula sa alas-dose.", "en_meaning": "The lunch break starts from 12 o'clock.", "tip_tl": "Inaabangan ang break time kasama ang mga kaibigan sa loob ng klase. Ang 'hiruyasumi' ay ang nakalaang oras para kumain at magpahinga sa tanghali.", "chunks": ["ひるやすみは、", "じゅうにじから", "だよ。"], "options": ["ひるやすみは、じゅうにじからだよ。", "ひるやすみは、じゅうにじからお疲れ様です。", "ひるやすみは、じゅうにじまでですよ。"], "correct": 0, "unit": 5}, {"id": "s2_u05_q12", "target_ja": "きょうの、ほうかごに話し合おう。", "romaji": "Kyou no, houkago ni hanashiaou.", "tl_meaning": "Mag-usap tayo mamaya pagkatapos ng klase.", "en_meaning": "Let's talk after school today.", "tip_tl": "Pag-anyaya sa kaklase para pag-usapan ang grupo o event project. Ang 'houkago' ay nangangahulugang pagkatapos ng mga klase sa hapon.", "chunks": ["きょうの、", "ほうかごに", "話し合おう。"], "options": ["きょうの、ほうかごに話し合おう。", "きょうの、ほうかごにお世話になろう。", "きょうの、ほうかごに話し合いますですか？"], "correct": 0, "unit": 5}, {"id": "s2_u06_q01", "target_ja": "これいくら？", "romaji": "Kore ikura?", "tl_meaning": "Magkano 'to?", "en_meaning": "How much is this?", "tip_tl": "Kasama ang mga kaklase sa mall pagkatapos ng eskwela. Kaswal na pagtatanong sa kaibigan tungkol sa presyo ng isang gamit.", "chunks": ["これ", "いくら？"], "options": ["これいくら？", "これいくらですかお疲れ様です。", "これをいくらしますか？"], "correct": 0, "unit": 6}, {"id": "s2_u06_q02", "target_ja": "これにする！", "romaji": "Kore ni suru!", "tl_meaning": "Ito ang kukunin ko! / Ito ang bibilhin ko!", "en_meaning": "I'll take this one!", "tip_tl": "Pumipili ng maiinom sa convenience store kasama ang kaibigan. Ang 'ni suru' ay ginagamit kapag nakapagdesisyon ka na sa iyong pipiliin.", "chunks": ["これに", "する！"], "options": ["これにする！", "これにするをします。", "これにあります。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q03", "target_ja": "ノートをください。", "romaji": "Nooto wo kudasai.", "tl_meaning": "Pakiabot / Pabili po ng notebook.", "en_meaning": "A notebook, please.", "tip_tl": "Bumibili ng school supplies sa bookstore sa loob ng mall. Ang 'wo kudasai' ay magalang ngunit simpleng paraan ng pagbili o pag-order.", "chunks": ["ノートを", "ください。"], "options": ["ノートをください。", "ノートをお疲れ様です。", "ノートをくださいでした。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q04", "target_ja": "おつりはいくら？", "romaji": "Otsuri wa ikura?", "tl_meaning": "Magkano ang sukli?", "en_meaning": "How much is the change?", "tip_tl": "Nagbibilang ng pera kasama ang kaklase pagkatapos bumili ng meryenda. Ang 'otsuri' ay nangangahulugang sukli.", "chunks": ["おつりは", "いくら？"], "options": ["おつりはいくら？", "おつりはどこですか？", "おつりをいくらですか？"], "correct": 0, "unit": 6}, {"id": "s2_u06_q05", "target_ja": "袋はいりません。", "romaji": "Fukuro wa irimasen.", "tl_meaning": "Huwag na po / Hindi ko na kailangan ng plastic bag.", "en_meaning": "I don't need a bag, please.", "tip_tl": "Sa counter ng convenience store malapit sa school. Sinasabi ito sa cashier kapag may dala kang sariling eco-bag sa school bag mo.", "chunks": ["袋は", "いりません。"], "options": ["袋はいりません。", "袋は要りませんだよ。", "袋をいりませんでした。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q06", "target_ja": "百円ショップに行こう！", "romaji": "Hyakuenshoppu ni ikou!", "tl_meaning": "Tara sa 100-yen shop!", "en_meaning": "Let's go to the 100-yen shop!", "tip_tl": "Niyayaya ang mga kaibigan sa mall para bumili ng murang abubot o school supplies. Ang 'ikou' ay ang kaswal na anyo ng 'tara / let's go'.", "chunks": ["百円ショップに", "行こう！"], "options": ["百円ショップに行こう！", "百円ショップに行きますお疲れ様です。", "百円ショップにいきましょうか。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q07", "target_ja": "カードは使えますか？", "romaji": "Kaado wa tsukaemasu ka?", "tl_meaning": "Pwede po bang gumamit ng card? / Tatanggap po ba kayo ng card?", "en_meaning": "Can I use a card?", "tip_tl": "Nagbabayad sa cashier ng isang malaking tindahan sa mall. Ang 'tsukaemasu ka' ay pagtatanong kung posible o pwedeng gamitin.", "chunks": ["カードは", "使えますか？"], "options": ["カードは使えますか？", "カードを使いますだよ？", "カードはつかえますね？"], "correct": 0, "unit": 6}, {"id": "s2_u06_q08", "target_ja": "ちょっと高いなぁ。", "romaji": "Chotto takai naa.", "tl_meaning": "Medyo mahal naman.", "en_meaning": "It's a bit expensive.", "tip_tl": "Tinitingnan ang isang sikat na sapatos o gadget kasama ang kaklase. Ang 'naa' sa dulo ay nagpapahayag ng sariling emosyon o opinyon.", "chunks": ["ちょっと", "高いなぁ。"], "options": ["ちょっと高いなぁ。", "ちょっとたかいをします。", "ちょっと高いでした。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q09", "target_ja": "レシートを忘れた！", "romaji": "Reshiito wo wasureta!", "tl_meaning": "Nakalimutan ko ang resibo!", "en_meaning": "I forgot the receipt!", "tip_tl": "Pagkalabas ng tindahan kasama ang kaibigan pagkatapos bumili ng gamit para sa club activity. Ang 'wasureta' ay past tense ng nakalimutan.", "chunks": ["レシートを", "忘れた！"], "options": ["レシートを忘れた！", "レシートをわすれましたお疲れ様です。", "レシートはわすれました。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q10", "target_ja": "あのガチャガチャ、やりたい。", "romaji": "Ano gachagacha, yaritai.", "tl_meaning": "Gusto kong maglaro / mag-ikot doon sa gachapon.", "en_meaning": "I want to try that capsule toy machine.", "tip_tl": "Nakakita ng anime toy machine sa game center ng mall kasama ang kaibigan. Ang 'yaritai' ay kaswal na pagsasabi ng kagustuhang gawin ang isang bagay.", "chunks": ["あの", "ガチャガチャ、", "やりたい。"], "options": ["あのガチャガチャ、やりたい。", "あのガチャガチャ、やりたいをします。", "あのガチャガチャ、やりたいでした。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q11", "target_ja": "新しいペンが買いたいな。", "romaji": "Atarashii pen ga kaitai na.", "tl_meaning": "Gusto ko sanang bumili ng bagong panulat.", "en_meaning": "I want to buy a new pen.", "tip_tl": "Nag-uusap sa chat sa Messenger tungkol sa pagpunta sa mall sa weekend. Ang 'kaitai' ay nais bumili, at ang 'ga' ang tamang particle bago nito.", "chunks": ["新しい", "ペンが", "買いたいな。"], "options": ["新しいペンが買いたいな。", "新しいペンをかいたいですお疲れ様です。", "新しいペンをかいたいです。"], "correct": 0, "unit": 6}, {"id": "s2_u06_q12", "target_ja": "おみせはどこにありますか？", "romaji": "Omise wa doko ni arimasu ka?", "tl_meaning": "Saan po matatagpuan ang tindahan?", "en_meaning": "Where is the shop located?", "tip_tl": "Nawawala sa malaking mall at nagtatanong sa information desk o sa isang guro na nakasabay. Ginamit ang pormal na 'arimasu ka' para sa maayos na pagtatanong.", "chunks": ["おみせは", "どこに", "ありますか？"], "options": ["おみせはどこにありますか？", "おみせはどこにありますかお世話になります。", "おみせはどこにいますか？"], "correct": 0, "unit": 6}, {"id": "s2_u07_q01", "target_ja": "おなかがすいた！", "romaji": "Onaka ga suita!", "tl_meaning": "Gutom na ako!", "en_meaning": "I'm hungry!", "tip_tl": "Pagkalabas ng classroom kasama ang mga kaibigan pagkatapos ng huling period. Kaswal na kaswal na ekspresyon na madalas sabihin ng mga magkakabata.", "chunks": ["おなかが", "すいた！"], "options": ["おなかがすいた！", "おなかがすきましたお疲れ様です。", "おなかがすいたでした。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q02", "target_ja": "ラーメンにしよう。", "romaji": "Raamen ni shiyou.", "tl_meaning": "Mag-ramen na lang tayo. / Mag-ramen tayo.", "en_meaning": "Let's have ramen.", "tip_tl": "Nag-iisip ng makakainan sa mall kasama ang mga kaklase. Ang 'ni shiyou' ay ginagamit para mag-propose o mag-suggest ng menu sa grupo.", "chunks": ["ラーメンに", "しよう。"], "options": ["ラーメンにしよう。", "ラーメンをしますお疲れ様です。", "ラーメンになります。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q03", "target_ja": "これ、おいしいよ！", "romaji": "Kore, oishii yo!", "tl_meaning": "Masarap 'to ah!", "en_meaning": "This is delicious!", "tip_tl": "Kumakain ng meryenda sa gilid ng school ground kasama ang mga kaibigan sa club. Ang 'yo' sa dulo ay nagpapakita ng pagbabahagi ng impormasyon o opinyon.", "chunks": ["これ、", "おいしいよ！"], "options": ["これ、おいしいよ！", "これ、おいしいをします！", "これ、おいしいでした。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q04", "target_ja": "お水をください。", "romaji": "Omizu wo kudasai.", "tl_meaning": "Pakiabot po ng tubig. / Humihingi po ng tubig.", "en_meaning": "Water, please.", "tip_tl": "Nasa loob ng restaurant o kainan kasama ang pamilya o kaibigan. Ang 'wo kudasai' ay simpleng paraan para humingi ng kahit anong bagay sa staff.", "chunks": ["お水を", "ください。"], "options": ["お水をください。", "お水をくださいでした。", "お水をお疲れ様です。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q05", "target_ja": "メニューを見せて！", "romaji": "Menyuu wo misete!", "tl_meaning": "Patingin nga ng menu!", "en_meaning": "Show me the menu!", "tip_tl": "Katatapos lang maupo sa isang fastfood o cafe kasama ang kaklase. Ang 'misete' ay kaswal na hiling para patingnan ang isang bagay.", "chunks": ["メニューを", "見せて！"], "options": ["メニューを見せて！", "メニューをみせてくださいお世話になります。", "メニューをみせます。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q06", "target_ja": "これ、からいですか？", "romaji": "Kore, karai desu ka?", "tl_meaning": "Maanghang po ba ito?", "en_meaning": "Is this spicy?", "tip_tl": "Pagtatanong sa waiter bago mag-order ng pagkain sa mall restaurant. Magalang na 'desu ka' ang gamit para maging maayos ang pakikipag-usap sa staff.", "chunks": ["これ、", "からいですか？"], "options": ["これ、からいですか？", "これ、からいだよ？", "これ、からいをしますか？"], "correct": 0, "unit": 7}, {"id": "s2_u07_q07", "target_ja": "いただきます！", "romaji": "Itadakimasu!", "tl_meaning": "Kain tayo! / Kakain na po.", "en_meaning": "Let's eat!", "tip_tl": "Sinasabi bago magsimulang kumain ng bento o meryenda sa school lunch break. Isang magandang kultura sa Hapon na nagpapakita ng pasasalamat sa pagkain.", "chunks": ["いただきます！"], "options": ["いただきます！", "ごちそうさま！", "いってらっしゃい！"], "correct": 0, "unit": 7}, {"id": "s2_u07_q08", "target_ja": "ごちそうさまでした！", "romaji": "Gochisousama deshita!", "tl_meaning": "Salamat sa pagkain! / Tapos na akong kumain.", "en_meaning": "Thank you for the meal!", "tip_tl": "Sinasabi pagkatapos kumain kasama ang mga kaibigan o kapag aalis na sa cafe. Ito ang kapares na salita ng 'Itadakimasu'.", "chunks": ["ごちそうさまでした！"], "options": ["ごちそうさまでした！", "いただきます！", "おつかれさまでした！"], "correct": 0, "unit": 7}, {"id": "s2_u07_q09", "target_ja": "ハンバーガーをふたつください。", "romaji": "Hanbaagaa wo futatsu kudasai.", "tl_meaning": "Dalawang hamburger nga po.", "en_meaning": "Two hamburgers, please.", "tip_tl": "Nag-oorder ng meryenda sa counter ng McDo o Jollibee sa mall. Tandaan na ang 'futatsu' ang tamang bilang para sa dalawang piraso ng pagkain.", "chunks": ["ハンバーガーを", "ふたつ", "ください。"], "options": ["ハンバーガーをふたつください。", "ハンバーガーをににんください。", "ハンバーガーをふたつをお世話になります。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q10", "target_ja": "甘いものは、別腹だよ！", "romaji": "Amai mono wa, betsubara dayo!", "tl_meaning": "May hiwalay na tiyan palagi para sa matatamis! (Dessert room)", "en_meaning": "There's always room for dessert!", "tip_tl": "Kumakain ng ice cream sa mall pagkatapos mag-ramen kasama ang mga kaklase. Ang 'betsubara' ay isang sikat na ekspresyon na ibig sabihin ay kaya pa ring kumain ng dessert kahit busog na.", "chunks": ["甘いものは、", "別腹だよ！"], "options": ["甘いものは、別腹だよ！", "甘いものは、お腹が痛いだよ！", "甘いものは、いりませんですよ。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q11", "target_ja": "トマトは、ちょっと苦手なんだ。", "romaji": "Tomato wa, chotto nigate nanda.", "tl_meaning": "Medyo hindi ko gusto / hindi ako kumakain ng kamatis.", "en_meaning": "I'm not a big fan of tomatoes.", "tip_tl": "Nag-uusap sa cafeteria tungkol sa mga pagkaing ayaw kainin. Ang 'nigate nanda' ay malambot at natural na paraan para sabihing hindi mo gusto ang isang pagkain nang hindi nagiging bastos.", "chunks": ["トマトは、", "ちょっと", "苦手なんだ。"], "options": ["トマトは、ちょっと苦手なんだ。", "トマトは、ちょっときらいをします。", "トマトは、ちょっと上手なんだ。"], "correct": 0, "unit": 7}, {"id": "s2_u07_q12", "target_ja": "みんなで、わりかんにしよう！", "romaji": "Minna de, warikan ni shiyou!", "tl_meaning": "Mag-KKB / hati-hati na lang tayong lahat sa bayad!", "en_meaning": "Let's split the bill!", "tip_tl": "Pagkatapos kumain sa isang restaurant kasama ang buong barkada ng school club. Ang 'warikan' ay ang kultura ng paghati-hati ng kabuuang babayaran ng pantay-pantay.", "chunks": ["みんなで、", "わりかんに", "しよう！"], "options": ["みんなで、わりかんにしよう！", "みんなで、わりかんをお世話になろう！", "みんなで、わりかんをしますでした。"], "correct": 0, "unit": 7}, {"id": "s2_u08_q01", "target_ja": "トイレはどこ？", "romaji": "Toire wa doko?", "tl_meaning": "Saan ang C.R.?", "en_meaning": "Where is the restroom?", "tip_tl": "Nasa bagong school building kasama ang kaklase. Kaswal na pagtatanong sa kaibigan kung nasaan ang banyo.", "chunks": ["トイレは", "どこ？"], "options": ["トイレはどこ？", "トイレはだれ？", "トイレはいつ？"], "correct": 0, "unit": 8}, {"id": "s2_u08_q02", "target_ja": "あっちだよ。", "romaji": "Acchi dayo.", "tl_meaning": "Doon banda.", "en_meaning": "It's over that way.", "tip_tl": "Pagtuturo ng direksyon sa kaklase sa corridor. Ang 'acchi' ay kaswal na salita para ituro ang direksyon na malayo sa inyong dalawa.", "chunks": ["あっち", "だよ。"], "options": ["あっちだよ。", "あっちをします。", "あっちでしたお疲れ様です。"], "correct": 0, "unit": 8}, {"id": "s2_u08_q03", "target_ja": "まっすぐ行ってね。", "romaji": "Massugu itte ne.", "tl_meaning": "Diretso ka lang.", "en_meaning": "Go straight ahead.", "tip_tl": "Pagpapaliwanag ng daan papunta sa science lab. Ang 'massugu' ay nangangahulugang diretso lang at huwag munang liliko.", "chunks": ["まっすぐ", "行ってね。"], "options": ["まっすぐ行ってね。", "まっすぐきてね。", "まっすぐみてね。"], "correct": 0, "unit": 8}, {"id": "s2_u08_q04", "target_ja": "右にまがって！", "romaji": "Migi ni magatte!", "tl_meaning": "Lumiko ka sa kanan!", "en_meaning": "Turn right!", "tip_tl": "Kasabay ang kaibigan habang nagbibisikleta papuntang mall. Ang 'migi' ay kanan at ang 'magatte' ay pautos na lumiko.", "chunks": ["右に", "まがって！"], "options": ["右にまがって！", "右にとまって！", "右にはいって！"], "correct": 0, "unit": 8}, {"id": "s2_u08_q05", "target_ja": "左にあるよ。", "romaji": "Hidari ni aru yo.", "tl_meaning": "Nasa kaliwa 'yun.", "en_meaning": "It's on the left.", "tip_tl": "Pagtuturo sa kaklase kung nasaan ang club room sa hallway. Ang 'hidari' ay kaliwa at ginagamit ang 'aru' dahil kwarto ang tinutukoy.", "chunks": ["左に", "あるよ。"], "options": ["左にあるよ。", "左にいるよ。", "左をしますよ。"], "correct": 0, "unit": 8}, {"id": "s2_u08_q06", "target_ja": "しょくいんしつはどこですか？", "romaji": "Shokuinshitsu wa doko desu ka?", "tl_meaning": "Saan po ang faculty room / teachers' room?", "en_meaning": "Where is the staff room?", "tip_tl": "Pagtatanong sa isang guro o senior student sa hallway. Magalang na 'desu ka' ang gamit para sa maayos na pakikipag-usap sa eskwelahan.", "chunks": ["しょくいんしつは", "どこですか？"], "options": ["しょくいんしつはどこですか？", "しょくいんしつはどこだよ？", "しょくいんしつをどこですか？"], "correct": 0, "unit": 8}, {"id": "s2_u08_q07", "target_ja": "えきまでどうやって行く？", "romaji": "Eki made dou yatte iku?", "tl_meaning": "Paano pumunta hanggang sa istasyon?", "en_meaning": "How do you get to the station?", "tip_tl": "Pagtatanong sa barkada pagkatapos ng club activities. Ang 'dou yatte' ay paraan kung paano makararating sa isang lugar.", "chunks": ["えきまで", "どうやって", "行く？"], "options": ["えきまでどうやって行く？", "えきまでなにで行く？", "えきまでだれと行くですか？"], "correct": 0, "unit": 8}, {"id": "s2_u08_q08", "target_ja": "あるいて十分くらいだよ。", "romaji": "Aruite juppun kurai dayo.", "tl_meaning": "Mga sampung minutong lakad lang.", "en_meaning": "It's about a 10-minute walk.", "tip_tl": "Pagkukuwento sa kaklase kung gaano kalapit ang mall mula sa school gate. Ang 'aruite' ay sa pamamagitan ng paglalakad at 'kurai' ay tinatayang oras.", "chunks": ["あるいて", "十分くらい", "だよ。"], "options": ["あるいて十分くらいだよ。", "あるいて十分くらいお疲れ様です。", "あるいて十分をします。"], "correct": 0, "unit": 8}, {"id": "s2_u08_q09", "target_ja": "モールはえきの近くだよ。", "romaji": "Mooru wa eki no chikaku dayo.", "tl_meaning": "Nasa malapit lang sa istasyon ang mall.", "en_meaning": "The mall is near the station.", "tip_tl": "Nagpaplano ng pupuntahan sa weekend kasama ang mga kaibigan. Ang 'chikaku' ay nangangahulugang malapit.", "chunks": ["モールは", "えきの", "近くだよ。"], "options": ["モールはえきの近くだよ。", "モールはえきの遠くだよ。", "モールはえきの前でした。"], "correct": 0, "unit": 8}, {"id": "s2_u08_q10", "target_ja": "こうばんできいてみよう！", "romaji": "Kouban de kiite miyou!", "tl_meaning": "Subukan nating magtanong sa police box / outpost!", "en_meaning": "Let's try asking at the police box!", "tip_tl": "Naliligaw kayo ng kaibigan mo habang naghahanap ng bagong bilihan ng manga. Ang 'kouban' ay maliit na police box sa Japan na laging handang magturo ng daan.", "chunks": ["こうばんで", "きいてみよう！"], "options": ["こうばんできいてみよう！", "こうばんでまっててね！", "こうばんをききますお世話になります。"], "correct": 0, "unit": 8}, {"id": "s2_u08_q11", "target_ja": "バスていはどこにありますか？", "romaji": "Basutei wa doko ni arimasu ka?", "tl_meaning": "Saan po matatagpuan ang sakayan ng bus?", "en_meaning": "Where is the bus stop located?", "tip_tl": "Pagtatanong sa isang tindero o gwardya sa labas ng train station. Ang 'basutei' ay bus stop at pormal na 'arimasu ka' ang gamit sa pagtatanong sa hindi kakilala.", "chunks": ["バスていは", "どこに", "ありますか？"], "options": ["バスていはどこにありますか？", "バスていはどこにいますか？", "バスていをどこに行きますか？"], "correct": 0, "unit": 8}, {"id": "s2_u08_q12", "target_ja": "いっしょに案内するよ、ついてきて！", "romaji": "Isshoni annai suru yo, tsuite kite!", "tl_meaning": "Sasabayan kitang puntahan at ituturo ko, sumunod ka sa akin!", "en_meaning": "I'll guide you there, follow me!", "tip_tl": "Mabait na sagot ng kaklase nang malaman niyang hindi mo pa kabisado ang daan papunta sa gymnasium. Ang 'tsuite kite' ay kaswal na 'sumunod ka sa akin'.", "chunks": ["いっしょに", "案内するよ、", "ついてきて！"], "options": ["いっしょに案内するよ、ついてきて！", "いっしょに案内しますお疲れ様でした！", "ひとりで案内するよ、さようなら！"], "correct": 0, "unit": 8}, {"id": "s2_u09_q01", "target_ja": "いまひま？", "romaji": "Ima hima?", "tl_meaning": "Free ka ba ngayon? / May ginagawa ka?", "en_meaning": "Are you free right now?", "tip_tl": "Pang-umpisang chat sa Messenger sa kaklase pagkauwi galing school. Kaswal na paraan para malaman kung pwede siyang makausap.", "chunks": ["いま", "ひま？"], "options": ["いまひま？", "いまひまですかお疲れ様です。", "いまひまをしますか？"], "correct": 0, "unit": 9}, {"id": "s2_u09_q02", "target_ja": "りょうかい！", "romaji": "Ryoukai!", "tl_meaning": "Roger! / Got it!", "en_meaning": "Got it! / Roger that!", "tip_tl": "Mabilisang reply sa group chat kapag may sinabing oras o plano. Madalas itong gamitin katumbas ng 'Noted' o thumbs-up sticker.", "chunks": ["りょうかい！"], "options": ["りょうかい！", "かしこまりましたお世話になります。", "いただきます！"], "correct": 0, "unit": 9}, {"id": "s2_u09_q03", "target_ja": "あとでへんしんするね！", "romaji": "Ato de henshin suru ne!", "tl_meaning": "Magre-reply ako mamaya ah!", "en_meaning": "I'll reply later!", "tip_tl": "May ginagawang practice sa club o naglalakad pauwi kaya hindi agad makakapag-chat nang mahaba. Ang 'henshin' ay reply sa message.", "chunks": ["あとで", "へんしんするね！"], "options": ["あとでへんしんするね！", "あとでへんしんをしますお疲れ様です。", "あとでへんしんしたよ。"], "correct": 0, "unit": 9}, {"id": "s2_u09_q04", "target_ja": "しゃしんをおくって！", "romaji": "Shashin wo okutte!", "tl_meaning": "Paki-send naman nung picture!", "en_meaning": "Please send the photo!", "tip_tl": "Nanghihingi ng litrato sa kaibigan na kinuha noong school sports fest o tambay sa mall. Ang 'okutte' ay pautos na ipadala o i-send.", "chunks": ["しゃしんを", "おくって！"], "options": ["しゃしんをおくって！", "しゃしんをみせてくださいお世話になります。", "しゃしんをかいてね！"], "correct": 0, "unit": 9}, {"id": "s2_u09_q05", "target_ja": "いまどこにいる？", "romaji": "Ima doko ni iru?", "tl_meaning": "Nasaan ka na ngayon?", "en_meaning": "Where are you now?", "tip_tl": "Naghahanapan kayo ng kaklase sa labas ng train station para sa lakad. Kaswal na tanong gamit ang 'iru' para sa tao.", "chunks": ["いま", "どこに", "いる？"], "options": ["いまどこにいる？", "いまどこにある？", "いまどこにいきますか？"], "correct": 0, "unit": 9}, {"id": "s2_u09_q06", "target_ja": "あしたのしゅくだい、なんだっけ？", "romaji": "Ashita no shukudai, nandakke?", "tl_meaning": "Ano nga ulit 'yung assignment para bukas?", "en_meaning": "What was tomorrow's homework again?", "tip_tl": "Pagtatanong sa kaklase sa chat dahil nakalimutan mo ang sinulat sa board. Ang 'nandakke' ay natural na paraan kapag may gustong kumpirmahin.", "chunks": ["あしたの", "しゅくだい、", "なんだっけ？"], "options": ["あしたのしゅくだい、なんだっけ？", "あしたのしゅくだいをいたしますか？", "あしたのしゅくだいはだれですか？"], "correct": 0, "unit": 9}, {"id": "s2_u09_q07", "target_ja": "このスタンプ、かわいい！", "romaji": "Kono sutanpu, kawaii!", "tl_meaning": "Ang cute ng sticker na 'to!", "en_meaning": "This sticker is so cute!", "tip_tl": "Nag-react ka sa sinend na anime sticker ng kaibigan mo sa chat. Ang 'sutanpu' ay せき、いつかな？"], "correct": 0, "unit": 10}, {"id": "s2_u10_q04", "target_ja": "はじめまして、マニラからきましたケンです。", "romaji": "Hajimemashite, Manira kara kimashita Ken desu.", "tl_meaning": "Nice to meet you, ako si Ken at galing ako sa Maynila.", "en_meaning": "Nice to meet you, I'm Ken and I came from Manila.", "tip_tl": "Maikling self-introduction sa harap ng klase kapag tinawag ng teacher. Maayos at magalang na kombinasyon ng pinanggalingan at pangalan.", "chunks": ["はじめまして、", "マニラから", "きました", "ケンです。"], "options": ["はじめまして、マニラからきましたケンです。", "はじめまして、マニラへいきますケンでした。", "こちらこそ、マニラからきましたケンです。"], "correct": 0, "unit": 10}, {"id": "s2_u10_q05", "target_ja": "教科書をわすれちゃった！", "romaji": "Kyoukasho wo wasurechatta!", "tl_meaning": "Naiwan / nakalimutan ko ang textbook ko!", "en_meaning": "I accidentally forgot my textbook!", "tip_tl": "Bago magsimula ang 1st period lesson kasama ang katabi. Ang 'wasurechatta' ay kaswal na paraan ng pagsasabi na hindi sinasadyang nakalimutan ang gamit.", "chunks": ["教科書を", "わすれちゃった！"], "options": ["教科書をわすれちゃった！", "教科書をわすれましたお疲れ様です！", "教科書をすてちゃった！"], "correct": 0, "unit": 10}, {"id": "s2_u10_q06", "target_ja": "いっしょにみよう、どうぞ！", "romaji": "Isshoni miyou, douzo!", "tl_meaning": "Tingnan natin nang sabay, heto o!", "en_meaning": "Let's share and look together, here you go!", "tip_tl": "Mabait na sagot ng katabi mo sa classroom nang makitang wala kang dalang libro. Ang 'douzo' ay pag-alok nang bukal sa loob.", "chunks": ["いっしょに", "みよう、", "どうぞ！"], "options": ["いっしょにみよう、どうぞ！", "ひとりでみなさい、どうぞ！", "いっしょにみますお世話になります！"], "correct": 0, "unit": 10}, {"id": "s2_u10_q07", "target_ja": "ひるごはん、いっしょにたべない？", "romaji": "Hirugohan, isshoni tabenai?", "tl_meaning": "Gusto mo bang sumabay kumain ng tanghalian?", "en_meaning": "Do you want to eat lunch together?", "tip_tl": "Pag-anyaya sa bagong kaklase sa simula ng lunch break. Ang 'tabenai?' ay kaswal na pag-anyaya (invitation) sa kaibigan.", "chunks": ["ひるごはん、", "いっしょに", "たべない？"], "options": ["ひるごはん、いっしょにたべない？", "ひるごはん、いっしょにたべますかお疲れ様です？", "ひるごはん、いっしょにたべませんでした？"], "correct": 0, "unit": 10}, {"id": "s2_u10_q08", "target_ja": "購買でパンをかってくるね。", "romaji": "Koubai de pan wo katte kuru ne.", "tl_meaning": "Bibili lang ako ng tinapay sa school canteen / store ah.", "en_meaning": "I'll go buy some bread at the school kiosk.", "tip_tl": "Pagpapaalam sa mga katabi bago lumabas ng classroom sa break time. Ang 'koubai' ay ang tindahan o kiosk sa loob ng paaralan sa Japan.", "chunks": ["購買で", "パンを", "かってくるね。"], "options": ["購買でパンをかってくるね。", "購買でパンをかってきますお疲れ様です。", "購買でパンをうってくるね。"], "correct": 0, "unit": 10}, {"id": "s2_u10_q09", "target_ja": "きょうのぶかつは何時から？", "romaji": "Kyou no bukatsu wa nanji kara?", "tl_meaning": "Anong oras magsisimula ang club practice ngayong araw?", "en_meaning": "What time does club practice start today?", "tip_tl": "Pagtatanong sa kapwa miyembro ng sports o music club sa hapon. Tinitiyak ang oras bago magpalit ng jersey o uniform.", "chunks": ["きょうの", "ぶかつは", "何時から？"], "options": ["きょうのぶかつは何時から？", "きょうのぶかつは何曜日から？", "きょうのぶかつは何人から？"], "correct": 0, "unit": 10}, {"id": "s2_u10_q10", "target_ja": "よじはんにたいいくかんにしゅうごうだよ。", "romaji": "Yojihan ni taiikukan ni shuugou dayo.", "tl_meaning": "Magtipon / magkita-kita tayo sa gym ng 4:30.", "en_meaning": "Let's gather at the gym at 4:30.", "tip_tl": "Paalala ng club captain o kaklase para sa orientation ng bagong members. Ang 'shuugou' ay pagtitipon ng grupo sa takdang lugar at oras.", "chunks": ["よじはんに", "たいいくかんに", "しゅうごうだよ。"], "options": ["よじはんにたいいくかんにしゅうごうだよ。", "よんじはんにたいいくかんにしゅうごうだよ。", "よじはんにたいいくかんにお世話になります。"], "correct": 0, "unit": 10}, {"id": "s2_u10_q11", "target_ja": "あとでインスタおしえてね！", "romaji": "Ato de Insuta oshiete ne!", "tl_meaning": "Pahingi o pa-follow naman ng Instagram mo mamaya ha!", "en_meaning": "Share your Instagram with me later!", "tip_tl": "Pagkakaibigan habang nag-aayos ng gamit bago umuwi pagkatapos ng buong araw. Natural na paraan ng mga high schoolers para manatiling konektado online.", "chunks": ["あとで", "インスタ", "おしえてね！"], "options": ["あとでインスタおしえてね！", "あとでインスタをお教え申し上げます！", "あとでインスタをみせてくださいお疲れ様です！"], "correct": 0, "unit": 10}, {"id": "s2_u10_q12", "target_ja": "きょうはおつかれ！またあしたね。", "romaji": "Kyou wa otsukare! Mata ashita ne.", "tl_meaning": "Ingat pauwi / good job today! See you tomorrow ha.", "en_meaning": "Great job today! See you tomorrow.", "tip_tl": "Pamamaalam sa school gate kasama ang barkada sa pagtatapos ng unang araw ng bagong semestre. Ang 'otsukare' dito ay pambarkadang pagbati bago maghiwa-hiwalay.", "chunks": ["きょうは", "おつかれ！", "また", "あしたね。"], "options": ["きょうはおつかれ！またあしたね。", "きょうはおつかれさまでございました！さようなら。", "きょうはごちそうさま！またらいねんね。"], "correct": 0, "unit": 10}], "s3": [{"id": "s3_u01_q01", "target_ja": "ほんをよむ", "romaji": "Hon wo yomu", "tl_meaning": "Magbasa ng libro", "en_meaning": "To read a book", "tip_tl": "Ang 'yomu' (よむ) ay Group I (U-verb). Ang gokan ay 'yo-' at ang gobi ay '-mu'. Sa 'masu-form', ang '-mu' ay nagiging '-mimasu'.", "chunks": ["ほんを", "よ", "む"], "options": ["ほんをよむ", "ほんをよめる", "ほんをよます"], "correct": 0, "unit": 1}, {"id": "s3_u01_q02", "target_ja": "ごはんをたべる", "romaji": "Gohan wo taberu", "tl_meaning": "Kumain ng kanin / pagkain", "en_meaning": "To eat a meal", "tip_tl": "Ang 'taberu' (たべる) ay Group II (Ru-verb). Ang gokan ay 'tabe-' at ang gobi ay '-ru'. Tanggalin lang ang '-ru' para maging 'tabemasu'.", "chunks": ["ごはんを", "たべ", "る"], "options": ["ごはんをたべる", "ごはんをたべります", "ごはんをたべな"], "correct": 0, "unit": 1}, {"id": "s3_u01_q03", "target_ja": "しゅくだいをする", "romaji": "Shukudai wo suru", "tl_meaning": "Gawin ang homework", "en_meaning": "To do homework", "tip_tl": "Ang 'suru' (する) ay Group III (Irregular). Ang buong salita ay nagbabago kaya ito ay nagiging 'shimasu' sa polite form.", "chunks": ["しゅくだいを", "す", "る"], "options": ["しゅくだいをする", "しゅくだいをすります", "しゅくだいをされね"], "correct": 0, "unit": 1}, {"id": "s3_u01_q04", "target_ja": "ともだちとあそぶ", "romaji": "Tomodachi to asobu", "tl_meaning": "Makipaglaro / makipag-bonding sa kaibigan", "en_meaning": "To hang out with friends", "tip_tl": "Ang 'asobu' (あそぶ) ay Group I. Ang gokan ay 'aso-' at ang gobi ay '-bu'. Nagiging '-bimasu' (asobimasu) ito.", "chunks": ["ともだちと", "あそ", "ぶ"], "options": ["ともだちとあそぶ", "ともだちとあそべる", "ともだちとあそべるる"], "correct": 0, "unit": 1}, {"id": "s3_u01_q05", "target_ja": "がっこうにいく", "romaji": "Gakkou ni iku", "tl_meaning": "Pumunta sa paaralan", "en_meaning": "To go to school", "tip_tl": "Ang 'iku' (いく) ay Group I. Ang gokan ay 'i-' at ang gobi ay '-ku'. Nagiging 'ikimasu' ito sa polite form.", "chunks": ["がっこうに", "い", "く"], "options": ["がっこうにいく", "がっこうにいける", "がっこうにいくる"], "correct": 0, "unit": 1}, {"id": "s3_u01_q06", "target_ja": "うちにくる", "romaji": "Uchi ni kuru", "tl_meaning": "Pumunta / pumariyan sa bahay", "en_meaning": "To come to my house", "tip_tl": "Ang 'kuru' (くる) ay Group III (Irregular). Nag-iiba ang basa ng gokan: 'kuru' (dictionary) ngunit 'kimasu' (masu-form).", "chunks": ["うちに", "く", "る"], "options": ["うちにくる", "うちにくりに", "うちにくりります"], "correct": 0, "unit": 1}, {"id": "s3_u01_q07", "target_ja": "てがみをかく", "romaji": "Tegami wo kaku", "tl_meaning": "Magsulat ng sulat", "en_meaning": "To write a letter", "tip_tl": "Ang 'kaku' (かく) ay Group I. Ang gokan ay 'ka-' at ang gobi ay '-ku'. Sa polite, ito ay nagiging 'kakimasu'.", "chunks": ["てがみを", "か", "く"], "options": ["てがみをかく", "てがみをかける", "てがみをかくります"], "correct": 0, "unit": 1}, {"id": "s3_u01_q08", "target_ja": "アニメをみる", "romaji": "Anime wo miru", "tl_meaning": "Manood ng anime", "en_meaning": "To watch anime", "tip_tl": "Ang 'miru' (みる) ay Group II. Kahit isang pantig lang ang gokan ('mi-'), nagtatapos ito sa '-ru' kaya madaling maging 'mimasu'.", "chunks": ["アニメを", "み", "る"], "options": ["アニメをみる", "アニメをみまする", "アニメをみります"], "correct": 0, "unit": 1}, {"id": "s3_u01_q09", "target_ja": "おんがくをきく", "romaji": "Ongaku wo kiku", "tl_meaning": "Makinig ng musika", "en_meaning": "To listen to music", "tip_tl": "Ang 'kiku' (きく) ay Group I. Ang gokan ay 'ki-' at ang gobi ay '-ku'. Huwag itong lilituhin sa Group II verbs.", "chunks": ["おんが Group I): kiku -> kikimasu -> kiite -> kikanai. Ang gokan ay 'kika-' at ang gobi ay '-nai'.", "chunks": ["おんがくを", "きか", "ない"], "options": ["おんがくをきかない", "おんがくをききない", "おんがくをきくない"], "correct": 0, "unit": 10}, {"id": "s3_u10_q10", "target_ja": "お菓子をかって", "romaji": "Okashi wo katte", "tl_meaning": "Bumili ng meryenda / Paki-bili ng tsitsirya", "en_meaning": "Buy some snacks", "tip_tl": "Pagsasanay sa serye ng 'kau' (Group I): kau -> kaimasu -> katte -> kawanai. Ang gokan ay 'ka-' at ang gobi ay '-tte'.", "chunks": ["お菓子を", "か", "って"], "options": ["お菓子をかって", "お菓子をかいて", "お菓子をかった"], "correct": 0, "unit": 10}, {"id": "s3_u10_q11", "target_ja": "うちに帰る", "romaji": "Uchi ni kaeru", "tl_meaning": "Umuwi sa bahay", "en_meaning": "To go back home", "tip_tl": "Pagsasanay sa exception na 'kaeru' (Group I): kaeru -> kaerimasu -> kaette -> kaeranai. Ang gokan ay 'kae-' at ang gobi ay '-ru'.", "chunks": ["うちに", "帰", "る"], "options": ["うちに帰る", "うちに帰りる", "うちに帰りまする"], "correct": 0, "unit": 10}, {"id": "s3_u10_q12", "target_ja": "おべんとうをかわない", "romaji": "Obentou wo kawanai", "tl_meaning": "Hindi bibili ng bento / lunch box", "en_meaning": "To not buy a bento box", "tip_tl": "Pagsasanay sa serye ng 'kau' (Group I): kau -> kaimasu -> katte -> kawanai. Ang gokan ay 'kawa-' at ang gobi ay '-nai'.", "chunks": ["おべんとうを", "かわ", "ない"], "options": ["おべんとうをかわない", "おべんとうをかあない", "おべんとうをかわないで"], "correct": 0, "unit": 10}], "s4": [{"id": "s4_u01_q01", "target_ja": "しつもんがあります！", "romaji": "Shitsumon ga arimasu!", "tl_meaning": "May tanong po ako!", "en_meaning": "I have a question!", "tip_tl": "Itataas ang kamay sa loob ng klase para magtanong kay Teacher. Ang 'arimasu' ay pormal at magalang na angkop para sa eskwelahan.", "chunks": ["しつもんが", "あります！"], "options": ["しつもんがあります！", "しつもんがあるよ！", "しつもんをしますお疲れ様です。"], "correct": 0, "unit": 1}, {"id": "s4_u01_q02", "target_ja": "もういちどおねがいします。", "romaji": "Mou ichido onegaishimasu.", "tl_meaning": "Pakiulit po ulit.", "en_meaning": "Once more, please.", "tip_tl": "Sinasabi kay Teacher kapag hindi mo narinig o naintindihan ang sinabi sa board. Napakahalagang parirala para sa magalang na hiling.", "chunks": ["もういちど", "おねがいします。"], "options": ["もういちどおねがいします。", "もういちどおねがい！", "もういちどよろしく。"], "correct": 0, "unit": 1}, {"id": "s4_u01_q03", "target_ja": "トイレにいってもいいですか？", "romaji": "Toire ni ittemo ii desu ka?", "tl_meaning": "Maaari po bang pumunta sa C.R.?", "en_meaning": "May I go to the restroom?", "tip_tl": "Magalang na paghingi ng pahintulot kay Teacher habang nagkakaklase. Huwag gagamitin ang kaswal na 'Toire itteii?' sa guro.", "chunks": ["トイレに", "いっても", "いいですか？"], "options": ["トイレにいってもいいですか？", "トイレにいっていい？", "トイレにいきたいですよ。"], "correct": 0, "unit": 1}, {"id": "s4_u01_q04", "target_ja": "私はいいと思います！", "romaji": "Watashi wa ii to omoimasu!", "tl_meaning": "Sa tingin ko po ay maganda 'yan! / Sang-ayon ako.", "en_meaning": "I think it is good!", "tip_tl": "Pagbabahagi ng iyong opinyon sa isang group discussion sa klase. Ang 'to omoimasu' ay ginagamit para magpahayag ng sariling saloobin sa maayos na paraan.", "chunks": ["私は", "いいと", "思います！"], "options": ["私はいいと思います！", "私はいいと思うよ！", "私はいいとしますお疲れ様です。"], "correct": 0, "unit": 1}, {"id": "s4_u01_q05", "target_ja": "これ、どういういみですか？", "romaji": "Kore, dou iu imi desu ka?", "tl_meaning": "Ano po ang ibig sabihin nito?", "en_meaning": "What does this mean?", "tip_tl": "Pagtatanong sa guro kapag may nakitang mahirap na Kanji sa blackboard. Ang 'dou iu imi' ay nagtatanong sa kahulugan ng isang bagay.", "chunks": ["これ、", "どういう", "いみですか？"], "options": ["これ、どういういみですか？", "これ、どういういみ？", "これ、どういういみでお世話になります。"], "correct": 0, "unit": 1}, {"id": "s4_u01_q06", "target_ja": "ちょっとわからないので、教えてください。", "romaji": "Chotto wakaranai node, oshiete kudasai.", "tl_meaning": "Medyo hindi ko po naintindihan, paki-paliwanag naman po.", "en_meaning": "I don't quite understand, so please teach me.", "tip_tl": "Pagtatanong sa guro o sa isang mas nakakatandang estudyante pagkatapos ng klase. Ang 'node' ay ginagamit para magbig let currentLang = localStorage.getItem('jp_lang') || 'tl';
let currentStage = localStorage.getItem('jp_stage') || 's1';
if(STAGES[currentStage].comingSoon) currentStage = 's1';

function T(key, ...args){
  const v = STR[currentLang][key];
  return typeof v === 'function' ? v(...args) : v;
}
function SV(){ return STAGES[currentStage]; }

document.getElementById('langTlBtn').addEventListener('click', () => setLang('tl'));

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('jp_lang', lang);
  applyStaticStrings();
  const active = document.querySelector('.screen.active');
  if(active && active.id === 'screen-home') renderHome();
  if(active && active.id === 'screen-lesson'){ renderProgressDots(); showStepQuestion(); }
  if(active && active.id === 'screen-complete') refreshCompleteTexts();
}

/* ==================== STORAGE (per stage) ==================== */
function lsKey(){ return `jp_progress_${currentStage}_v1`; }
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(lsKey())) || {mastered:{}, weak:{}}; }
  catch(e){ return {mastered:{}, weak:{}}; }
}
function saveProgress(p){ localStorage.setItem(lsKey(), JSON.stringify(p)); }
let progress = loadProgress();

/* ==================== AUDIO (Japanese TTS + 437Hz brand tone) ==================== */
let voices = [];
let voicePrefs = JSON.parse(localStorage.getItem('jp_voice_prefs') || '{}');
if(voicePrefs.speed === undefined) voicePrefs.speed = 0.90;

function refreshVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ja')) : [];
  populateVoiceSelect();
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function populateVoiceSelect(){
  const sel = document.getElementById('voiceSelect');
  if(!sel) return;
  sel.innerHTML = '';
  if(voices.length === 0){
    const opt = document.createElement('option');
    opt.textContent = '(default / walang Japanese voice na nakita)';
    sel.appendChild(opt);
    return;
  }
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(opt);
  });
  if(voicePrefs.voiceName){
    const idx = voices.findIndex(v => v.name === voicePrefs.voiceName);
    if(idx >= 0) sel.value = idx;
  }
}
function getSelectedVoice(){
  if(voicePrefs.voiceName){
    const found = voices.find(v => v.name === voicePrefs.voiceName);
    if(found) return found;
  }
  return voices[0];
}
const AUDIO_BASE = 'audio/'; // pre-generated Google Cloud TTS files, e.g. audio/s1_u01_q01.mp3
function speakWithSynthesis(text, onEnd){
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = getSelectedVoice();
  if(v) u.voice = v;
  u.lang = 'ja-JP';
  u.rate = voicePrefs.speed || 0.90;
  if(onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
}
function speak(text, onEnd, id){
  if(!id){ speakWithSynthesis(text, onEnd); return; }
  const audio = new Audio(AUDIO_BASE + id + '.mp3');
  audio.playbackRate = voicePrefs.speed || 0.90;
  let handled = false;
  audio.addEventListener('ended', () => { handled = true; if(onEnd) onEnd(); });
  audio.addEventListener('error', () => {
    if(handled) return;
    handled = true;
    speakWithSynthesis(text, onEnd); // pre-generated file missing/failed to load — fall back
  });
  audio.play().catch(() => {
    if(handled) return;
    handled = true;
    speakWithSynthesis(text, onEnd);
  });
}
function playBrandTone(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 437;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.9);
  }catch(e){}
}

/* ==================== NAV ==================== */
const screens = {
  home: document.getElementById('screen-home'),
  lesson: document.getElementById('screen-lesson'),
  complete: document.getElementById('screen-complete'),
};
const headerBackBtn = document.getElementById('headerBackBtn');
function showScreen(name){

  screens[name].classList.add('active');
  headerBackBtn.style.display = (name === 'home') ? 'none' : 'block';

headerBackBtn.addEventListener('click', () => { if(confirm(T('backConfirm'))) renderHome(); });

/* ==================== STAGE SELECTOR ==================== */
function renderStageSelector(){
  const wrap = document.getElementById('stageSelector');
  wrap.innerHTML = '';
  STAGE_ORDER.forEach(key => {
    const lv = STAGES[key];
    const pill = document.createElement('div');
    pill.className = 'stage-pill' + (key === currentStage ? ' active' : '') + (lv.comingSoon ? ' disabled' : '');
    pill.innerHTML = `

/* ==================== HOME RENDER ==================== */
function unitStats(unitN){
  const qs = SV().questions.filter(q => q.unit === unitN);
  const masteredCount = qs.filter(q => progress.mastered[q.id]).length;
  return { total: qs.length, mastered: masteredCount };
}
function totalWeakCount(){ return Object.keys(progress.weak).length; }

function renderHome(){
  renderStageSelector();

  const list = document.getElementById('unitList');
  list.innerHTML = '';
  SV().units.forEach(u => {
    const stats = unitStats(u.n);
    const pct = stats.total ? Math.round((stats.mastered/stats.total)*100) : 0;
    const isEmpty = stats.total === 0;
    const row = document.createElement('div');
    row.className = 'unit-row' + (isEmpty ? ' disabled' : '');
    row.innerHTML = `
      <div class="unit-seal ${pct===100?'mastered':''}">${pct===100?'✓':String(u.n).padStart(2,'0')}</div>
      <div class="unit-body">
        <div class="unit-theme">Unit ${u.n} — ${u.jp}</div>
        <div class="unit-particle">${u.badge}</div>
        <div class="unit-desc">${currentLang === 'tl' ? u.tl : u.en}</div>
        <div class="unit-track"><div class="unit-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="unit-count">${isEmpty ? T('comingSoon') : `${stats.mastered}/${stats.total}`}</div>
    `;
    if(!isEmpty) row.addEventListener('click', () => startUnit(u.n));
    list.appendChild(row);
  });

  const weakCta = document.getElementById('weakCta');
  const wc = totalWeakCount();
  document.getElementById('weakCount').textContent = wc;
  weakCta.style.display = wc > 0 ? 'flex' : 'none';
  weakCta.onclick = () => startWeakReview();

  applyStaticStrings();
  showScreen('home');
}

/* ==================== LESSON STATE ==================== */
let session = { queue: [], idx: 0, correctCount: 0, wrongIds: [], unitLabel: '', isWeakMode:false, startTime:0 };

function startUnit(unitN){
  const qs = SV().questions.filter(q => q.unit === unitN);
  const meta = SV().units.find(u => u.n === unitN);
  session = { queue: qs, idx:0, correctCount:0, wrongIds:[], unitLabel:`Unit ${unitN} — ${meta.jp}`, isWeakMode:false, startTime:Date.now() };
  runLesson();
}
function startWeakReview(){
  const ids = Object.keys(progress.weak);
  const qs = SV().questions.filter(q => ids.includes(q.id));
  if(qs.length === 0) return;
  session = { queue: qs, idx:0, correctCount:0, wrongIds:[], unitLabel:T('weakModeLabel'), isWeakMode:true, startTime:Date.now() };
  runLesson();
}

function runLesson(){
  document.getElementById('lessonUnitTag').textContent = `${SV().code} · ${session.unitLabel}`;
  renderProgressDots();
  showStepQuestion();
  showScreen('lesson');
}

function renderProgressDots(){
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = '';
  session.queue.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if(i < session.idx) d.classList.add(session.wrongIds.includes(q.id) ? 'wrong' : 'done');
    if(i === session.idx) d.classList.add('now');
    wrap.appendChild(d);
  });
}

/* ==================== QUESTION FLOW ==================== */
let chunkState = { pool: [], placed: [], correctSeq: [] };
let step2Answered = false;

function currentQ(){ return session.queue[session.idx]; }

function showStepQuestion(){
  const panes = ['step1','step2','step3','step4'];
  panes.forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('step1').style.display = 'block';
  applyStaticStrings();
  setupStep1();
}

/* --- STEP 1: listening --- */
let listenCount = 0;
function setupStep1(){
  const q = currentQ();
  listenCount = 0;
  document.getElementById('listenCount').textContent = '';
  document.getElementById('toStep2Btn').disabled = true;
  const playBtn = document.getElementById('playBtn');
  playBtn.onclick = () => {
    playBtn.classList.add('playing');
    speak(q.target_ja, () => {
      playBtn.classList.remove('playing');
      listenCount++;
      document.getElementById('listenCount').textContent = T('listenCount', listenCount);
      document.getElementById('toStep2Btn').disabled = false;
    }, q.id);
  };
  document.getElementById('toStep2Btn').onclick = () => {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    setupStep2();
  };
}

/* --- STEP 2: choose the correct written form for what you just heard --- */
function setupStep2(){
  const q = currentQ();
  step2Answered = false;
  const blankHtml = document.getElementById('blankSentence');
  blankHtml.innerHTML = `<span class="slot" id="slotMark">?</span>`;

  const list = document.getElementById('choiceList');
  list.innerHTML = '';
  q.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'choice';
    el.textContent = opt;
    el.addEventListener('click', () => {
      if(step2Answered) return;
      step2Answered = true;
      const cards = list.querySelectorAll('.choice');
      cards.forEach(c => c.classList.add('disabled'));
      const slot = document.getElementById('slotMark');
      if(i === q.correct){
        el.classList.add('correct');
        slot.textContent = opt.split(' ')[0];
        slot.classList.add('filled');
      } else {
        el.classList.add('wrong');
        cards[q.correct].classList.add('correct');
        slot.textContent = q.options[q.correct].split(' ')[0];
        slot.classList.add('filled');
        markWrong(q);
      }
      setTimeout(() => {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        setupStep3();
      }, 750);
    });
    list.appendChild(el);
  });
}

/* --- STEP 3: chunk reorder (movable type) --- */
function setupStep3(){
  const q = currentQ();
  if(q.chunks.length <= 1){
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step4').style.display = 'block';
    setupStep4();
    return;
  }
  chunkState.correctSeq = q.chunks.slice();
  chunkState.placed = [];
  chunkState.pool = q.chunks.map((c,i) => ({text:c, key:i, used:false}));
  shuffleUntilDifferent(chunkState.pool);
  renderAssembly();
}
function shuffleUntilDifferent(arr){
  if(arr.length <= 1) return;
  const original = arr.map(a=>a.text).join('|');
  let tries = 0;
  do{
    for(let i = arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    tries++;
  } while(arr.map(a=>a.text).join('|') === original && tries < 8);
}
function renderAssembly(){
  const line = document.getElementById('assemblyLine');
  const pool = document.getElementById('typePool');
  line.innerHTML = '';
  pool.innerHTML = '';

  if(chunkState.placed.length === 0){
    line.classList.remove('filled');
    line.innerHTML = `<span class="assembly-placeholder">${T('assemblyPlaceholder')}</span>`;
  } else {
    line.classList.add('filled');
    chunkState.placed.forEach(p => {
      const b = document.createElement('span');
      b.className = 'type-block used-slot jp';
      b.textContent = p.text;
      b.addEventListener('click', () => {
        if(chunkState.placed[chunkState.placed.length-1].key === p.key){
          chunkState.placed.pop();
          const orig = chunkState.pool.find(x => x.key === p.key);
          orig.used = false;
          renderAssembly();
        }
      });
      line.appendChild(b);
    });
  }

  chunkState.pool.forEach(p => {
    const b = document.createElement('span');
    b.className = 'type-block jp' + (p.used ? ' placed' : '');
    b.textContent = p.text;
    if(!p.used){
      b.addEventListener('click', () => {
        p.used = true;
        chunkState.placed.push(p);
        renderAssembly();
        if(chunkState.placed.length === chunkState.pool.length){
          evaluateAssembly();
        }
      });
    }
    pool.appendChild(b);
  });
}
document.getElementById('resetChunksBtn').addEventListener('click', () => {
  chunkState.pool.forEach(p => p.used = false);
  chunkState.placed = [];
  renderAssembly();
});
function evaluateAssembly(){
  const q = currentQ();
  const built = chunkState.placed.map(p => p.text).join('|');
  const correct = chunkState.correctSeq.join('|');
  const ok = built === correct;
  const line = document.getElementById('assemblyLine');
  line.style.borderColor = ok ? 'var(--good)' : 'var(--bad)';
  if(!ok) markWrong(q);
  setTimeout(() => {
    line.style.borderColor = '';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step4').style.display = 'block';
    setupStep4();
  }, 650);
}

/* --- STEP 4: reveal + shadow reading --- */
function setupStep4(){
  const q = currentQ();
  document.getElementById('revealJp').textContent = q.target_ja;
  document.getElementById('revealRomaji').textContent = q.romaji;
  document.getElementById('revealMeaning').textContent = currentLang === 'tl' ? q.tl_meaning : q.en_meaning;
  document.getElementById('revealTip').innerHTML = `<b>${T('tipPrefix')}</b>${q.tip_tl || ''}<span class="tip-lang-note">${T('tipLangNote')}</span>`;
  document.getElementById('replayBtn').onclick = () => speak(q.target_ja, null, q.id);
  setupSpeechCheck(q);
  document.getElementById('nextQBtn').onclick = () => {
    document.getElementById('step4').style.display = 'none';
    advanceQuestion(q);
  };
}

/* --- Speech recognition: pronunciation check --- */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

function normalizeJa(s){
  return (s || '')
    .replace(/[\s、。！？!?・「」『』"'.,]/g, '')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .toLowerCase();
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for(let i = 0; i <= m; i++) dp[i][0] = i;
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function similarity(a, b){
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length) || 1;
  return 1 - (dist / maxLen);
}

function setupSpeechCheck(q){
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('speakStatus');
  const resultEl = document.getElementById('speakResult');
  resultEl.style.display = 'none';
  resultEl.className = 'speak-result';
  statusEl.textContent = '';

  if(!SpeechRecognitionAPI){
    micBtn.disabled = true;
    statusEl.textContent = T('micNoSupport');
    return;
  }
  statusEl.textContent = T('micTapToSpeak');

  micBtn.onclick = () => {
    const recognition = new SpeechRecognitionAPI();
    recognition.lang = 'ja-JP';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    micBtn.classList.add('recording');
    micBtn.disabled = true;
    statusEl.textContent = T('micListening');
    resultEl.style.display = 'none';

    recognition.onresult = (event) => {
      const heard = event.results[0][0].transcript;
      const score = similarity(normalizeJa(heard), normalizeJa(q.target_ja));
      resultEl.style.display = 'block';
      resultEl.className = 'speak-result ' + (score >= 0.7 ? 'ok' : 'ng');
      resultEl.innerHTML = `<span class="heard">${heard}</span>${score >= 0.7 ? T('micOk') : T('micRetry')}`;
    };
    recognition.onerror = () => {
      resultEl.style.display = 'block';
      resultEl.className = 'speak-result ng';
      resultEl.innerHTML = T('micNoMatch');
    };
    recognition.onend = () => {
      micBtn.classList.remove('recording');
      micBtn.disabled = false;
      statusEl.textContent = T('micTapToSpeak');
    };
    recognition.start();
  };
}

function markWrong(q){
  if(!session.wrongIds.includes(q.id)) session.wrongIds.push(q.id);
  progress.weak[q.id] = true;
  saveProgress(progress);
}

function advanceQuestion(q){
  if(!session.wrongIds.includes(q.id)){
    session.correctCount++;
    progress.mastered[q.id] = true;
    delete progress.weak[q.id];
    saveProgress(progress);
  }
  session.idx++;
  if(session.idx >= session.queue.length){
    finishSession();
  } else {
    renderProgressDots();
    showStepQuestion();
  }
}

/* ==================== COMPLETE SCREEN ==================== */
let lastCompleteStats = null;
function finishSession(){
  renderProgressDots();
  playBrandTone();
  const total = session.queue.length;
  const correct = session.correctCount;
  const pct = Math.round((correct/total)*100);
  const seconds = Math.round((Date.now() - session.startTime)/1000);
  const mm = Math.floor(seconds/60), ss = seconds%60;
  lastCompleteStats = { total, correct, pct, mm, ss };

  refreshCompleteTexts();

  const retryBtn = document.getElementById('retryWrongBtn');
  if(session.wrongIds.length > 0){
    retryBtn.style.display = 'block';
    retryBtn.onclick = () => {
      const qs = SV().questions.filter(q => session.wrongIds.includes(q.id));
      session = { queue: qs, idx:0, correctCount:0, wrongIds:[], unitLabel: session.unitLabel + T('weakModeSuffix'), isWeakMode:true, startTime:Date.now() };
      runLesson();
    };
  } else {
    retryBtn.style.display = 'none';
  }
  document.getElementById('toHomeBtn').onclick = renderHome;
  showScreen('complete');
}
function refreshCompleteTexts(){
  if(!lastCompleteStats) return;
  const {total, correct, pct, mm, ss} = lastCompleteStats;
  document.getElementById('completeSealText').textContent = pct === 100 ? T('complete100') : T('completeDefault');
  document.getElementById('completeUnitName').textContent = session.unitLabel;
  document.getElementById('completeScore').textContent = `${correct} / ${total}`;
  document.getElementById('completeMeta').textContent = T('completeMeta', pct, mm, ss);
  document.getElementById('retryWrongBtn').textContent = T('retryWrongBtn');
  document.getElementById('toHomeBtn').textContent = T('toHomeBtn');
}

/* ==================== INIT ==================== */
applyStaticStrings();
renderHome();
</script>
