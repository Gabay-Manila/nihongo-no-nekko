<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>にほんごの根っこ活字堂 / Nihongo no Nekko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Spectral:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Yoshida EdTech Works 共通ブランドトークン(yew-color-tokens.css準拠) */
    --brand-ink:#2B2926;
    --brand-cream:#EFEAE0;
    --brand-cream-deep:#E4DECE;
    --brand-stone:#C9C2B4;
    --brand-stone-line:#DDD6C6;
    --brand-accent-fill:#E08A34;  /* マンゴー(学習系) */
    --brand-accent-text:#A85F1D;
    --brand-logo-mark:#9C7A2E;    /* 「活」ロゴマーク専用・装飾のみ */

    /* このファイル内で使う内部変数(上のブランドトークンにマッピング) */
    --ink:var(--brand-cream);
    --ink-panel:var(--brand-cream);
    --ink-panel-2:var(--brand-cream-deep);
    --hairline:var(--brand-stone-line);
    --brass:var(--brand-accent-fill);
    --brass-bright:var(--brand-accent-text);
    --brass-dim:var(--brand-stone);
    --text:var(--brand-ink);
    --text-mute:#7A7566;
    --good:#5F7F5F;
    --good-bg:#E7EEE3;
    --bad:#B15D42;
    --bad-bg:#F6E7DF;
    --on-accent:var(--brand-cream);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .jp{ font-family:'Zen Kaku Gothic New', sans-serif; }
  .jp-display{ font-family:'Shippori Mincho', serif; }
  .romaji{ font-family:'Spectral', serif; font-style:italic; }

  #app{ max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:24px; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:16px 20px 14px;
    border-bottom:1px solid var(--hairline);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; min-width:0; }
  .brand .mark{ color:var(--brand-logo-mark); font-size:20px; letter-spacing:.14em; flex-shrink:0; }
  .brand .name{ font-family:'Shippori Mincho', serif; font-size:15px; letter-spacing:.02em; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand .sub{ font-size:9px; color:var(--text-mute); letter-spacing:.12em; white-space:nowrap; }
  .header-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }

  .lang-toggle{ display:flex; border:1px solid var(--hairline); border-radius:20px; overflow:hidden; flex-shrink:0; }
  .lang-toggle button{
    background:none; border:none; color:var(--text-mute);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:11px; letter-spacing:.05em; font-weight:700;
    padding:6px 12px; cursor:pointer;
  }
  .lang-toggle button.active{ background:var(--brass); color:var(--on-accent); }

  .icon-btn{
    background:none;border:1px solid var(--hairline); color:var(--brass-bright);
    font-size:14px; width:32px; height:32px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--brass-dim); }
  .back-btn{
    background:none;border:1px solid var(--hairline); color:var(--brass-bright);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:12px; letter-spacing:.05em;
    padding:7px 12px; border-radius:3px; cursor:pointer; flex-shrink:0;
  }
  .back-btn:hover{ border-color:var(--brass-dim); }

  .screen{ flex:1; display:none; flex-direction:column; padding:22px 20px 8px; animation:fadeIn .28s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Stage selector ---------- */
  .stage-selector{ display:flex; gap:8px; margin-bottom:20px; }
  .stage-pill{
    flex:1; background:var(--ink-panel); border:1px solid var(--hairline); border-radius:8px;
    padding:12px 10px; text-align:center; cursor:pointer; position:relative;
  }
  .stage-pill:hover{ border-color:var(--brass-dim); }
  .stage-pill.active{ border-color:var(--brass); background:linear-gradient(135deg,var(--ink-panel),var(--ink-panel-2)); }
  .stage-pill .sp-code{ font-family:'Spectral',serif; font-size:17px; color:var(--brass-bright); }
  .stage-pill.active .sp-code{ color:var(--brass-bright); }
  .stage-pill .sp-name{ font-size:10px; color:var(--text-mute); margin-top:2px; letter-spacing:.02em; }
  .stage-pill.disabled{ opacity:.45; cursor:not-allowed; }
  .stage-pill .sp-soon{
    position:absolute; top:-7px; right:-6px; background:var(--brass-dim); color:var(--on-accent);
    font-size:8px; letter-spacing:.06em; padding:2px 5px; border-radius:8px; font-weight:700;
  }

  .hero{ margin-bottom:22px; }
  .hero .eyebrow{ color:var(--brass-bright); font-size:11px; letter-spacing:.2em; margin-bottom:6px; }
  .hero h1{ font-family:'Shippori Mincho', serif; font-size:23px; margin:0 0 8px; line-height:1.45; }
  .hero p{ color:var(--text-mute); font-size:13px; line-height:1.8; margin:0; }

  .weak-cta{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg, var(--ink-panel-2), var(--ink-panel));
    border:1px solid var(--brass-dim); border-radius:6px; padding:14px 16px; margin-bottom:22px; cursor:pointer;
  }
  .weak-cta:hover{ border-color:var(--brass); }
  .weak-cta .wl-title{ font-size:14px; color:var(--brass-bright); font-weight:700; }
  .weak-cta .wl-sub{ font-size:11px; color:var(--text-mute); margin-top:3px; }
  .weak-cta .wl-count{ font-family:'Spectral',serif; font-size:26px; color:var(--brass-bright); }

  .unit-list{ display:flex; flex-direction:column; gap:10px; }
  .unit-row{
    display:flex; align-items:center; gap:14px;
    background:var(--ink-panel); border:1px solid var(--hairline);
    border-radius:6px; padding:13px 14px; cursor:pointer;
    transition:border-color .15s, transform .15s;
  }
  .unit-row:hover{ border-color:var(--brass-dim); transform:translateX(2px); }
  .unit-row.disabled{ cursor:default; opacity:.45; }
  .unit-row.disabled:hover{ border-color:var(--hairline); transform:none; }
  .unit-seal{
    width:42px; height:42px; border-radius:50%; border:1.5px solid var(--brass-dim);
    display:flex; align-items:center; justify-content:center;
    font-family:'Spectral',serif; font-size:15px; color:var(--brass-bright); flex-shrink:0;
  }
  .unit-seal.mastered{ border-color:var(--brass); background:rgba(224,138,52,.12); color:var(--brass-bright); }
  .unit-body{ flex:1; min-width:0; }
  .unit-theme{ font-size:14px; font-weight:700; color:var(--text); }
  .unit-particle{
    display:inline-block; font-family:'Spectral',serif; font-size:10.5px; color:var(--brass-bright);
    border:1px solid var(--brass-dim); border-radius:3px; padding:1px 6px; margin-top:4px;
  }
  .unit-desc{ font-size:11px; color:var(--text-mute); margin-top:4px; line-height:1.5; }
  .unit-track{ height:3px; background:var(--hairline); border-radius:2px; margin-top:8px; overflow:hidden; }
  .unit-fill{ height:100%; background:var(--brass); border-radius:2px; transition:width .3s; }
  .unit-count{ font-family:'Spectral',serif; font-size:12px; color:var(--text-mute); white-space:nowrap; }

  .lesson-progress{ display:flex; gap:5px; margin-bottom:22px; flex-wrap:wrap; }
  .dot{ width:100%; max-width:22px; flex:1; height:5px; border-radius:3px; background:var(--hairline); }
  .dot.done{ background:var(--brass-dim); }
  .dot.now{ background:var(--brass); }
  .dot.wrong{ background:var(--bad); }

  .step-label{ color:var(--brass-bright); font-size:11px; letter-spacing:.2em; margin-bottom:10px; }
  .q-unit-tag{ color:var(--text-mute); font-size:11px; margin-bottom:2px; }

  .listen-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:30px 0 10px; }
  .speaker-btn{
    width:104px; height:104px; border-radius:50%; border:1.5px solid var(--brass);
    background:radial-gradient(circle at 35% 30%, var(--ink-panel), var(--ink-panel-2));
    color:var(--brass-bright); font-size:34px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
  }
  .speaker-btn.playing{ animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(224,138,52,.28);} 70%{box-shadow:0 0 0 18px rgba(224,138,52,0);} 100%{box-shadow:0 0 0 0 rgba(224,138,52,0);} }
  .listen-hint{ color:var(--text-mute); font-size:12px; text-align:center; letter-spacing:.03em; }
  .listen-count{ font-size:11px; color:var(--brass-dim); }

  .primary-btn{
    background:var(--brass); color:var(--on-accent); border:none; font-weight:700;
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:14px; letter-spacing:.03em;
    padding:13px 22px; border-radius:5px; cursor:pointer; width:100%;
  }
  .primary-btn:disabled{ background:var(--hairline); color:var(--text-mute); cursor:not-allowed; }
  .primary-btn:not(:disabled):hover{ background:var(--brass-bright); }
  .ghost-btn{
    background:none; border:1px solid var(--hairline); color:var(--text-mute);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; padding:11px 18px;
    border-radius:5px; cursor:pointer; width:100%;
  }
  .ghost-btn:hover{ border-color:var(--brass-dim); color:var(--brass-bright); }

  .blank-sentence{
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:21px; line-height:2;
    text-align:center; padding:26px 10px; margin-bottom:22px;
    background:var(--ink-panel); border:1px solid var(--hairline); border-radius:8px;
    letter-spacing:.02em;
  }
  .blank-sentence .slot{
    display:inline-block; min-width:56px; border-bottom:2px solid var(--brass);
    color:var(--brass-dim); margin:0 4px;
  }
  .blank-sentence .slot.filled{ color:var(--brass-bright); }

  .choice-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .choice{
    background:var(--ink-panel); border:1px solid var(--hairline); border-radius:6px;
    padding:14px 16px; font-size:16px; cursor:pointer; text-align:center;
    font-family:'Spectral',serif;
  }
  .choice:hover{ border-color:var(--brass-dim); }
  .choice.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .choice.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .choice.disabled{ pointer-events:none; opacity:.55; }

  .assembly-line{
    min-height:66px; border:1px dashed var(--hairline); border-radius:6px;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px;
    margin-bottom:18px; background:rgba(0,0,0,.025);
  }
  .assembly-line.filled{ border-style:solid; border-color:var(--brass-dim); }
  .assembly-placeholder{ color:var(--text-mute); font-size:12px; letter-spacing:.05em; }
  .type-block{
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:16px;
    background:linear-gradient(180deg,var(--ink-panel),var(--ink-panel-2));
    border:1px solid var(--brass-dim); color:var(--brass-bright);
    padding:9px 14px; border-radius:3px; cursor:pointer; user-select:none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .type-block:hover{ border-color:var(--brass); }
  .type-block.placed{ opacity:.3; cursor:default; }
  .type-block.used-slot{
    background:linear-gradient(180deg,var(--brass),var(--brass-bright)); border-color:var(--brass); color:var(--on-accent);
  }
  .type-pool{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .assembly-caption{ font-size:11px; color:var(--text-mute); margin:-10px 0 16px; letter-spacing:.03em; }

  .reveal-card{
    background:var(--ink-panel); border:1px solid var(--hairline); border-radius:8px;
    padding:22px 20px; margin-bottom:16px;
  }
  .reveal-jp{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:22px; line-height:1.7; color:var(--brass-bright); margin-bottom:6px; }
  .reveal-romaji{ font-family:'Spectral',serif; font-style:italic; font-size:13px; color:var(--brass-dim); margin-bottom:12px; }
  .reveal-meaning{ font-size:13px; color:var(--text-mute); margin-bottom:14px; }
  .reveal-tip{ border-top:1px solid var(--hairline); padding-top:12px; font-size:12.5px; line-height:1.8; color:var(--text); }
  .reveal-tip b{ color:var(--brass-bright); }
  .reveal-tip .tip-lang-note{ font-size:10px; color:var(--text-mute); display:block; margin-top:6px; }
  .speak-check{ border-top:1px solid var(--hairline); margin-top:14px; padding-top:16px; text-align:center; }
  .mic-btn{
    width:64px; height:64px; border-radius:50%; border:1.5px solid var(--brass);
    background:var(--ink-panel-2); color:var(--brass-bright); font-size:26px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; transition:background .15s,border-color .15s;
  }
  .mic-btn:hover{ border-color:var(--brass-bright); }
  .mic-btn.recording{ background:var(--brass); color:var(--on-accent); animation:pulse 1.2s infinite; }
  .mic-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .speak-status{ font-size:12px; color:var(--text-mute); margin-top:10px; min-height:16px; }
  .speak-result{ margin-top:12px; padding:12px 14px; border-radius:6px; font-size:13px; line-height:1.7; text-align:left; }
  .speak-result.ok{ background:var(--good-bg); color:var(--good); }
  .speak-result.ng{ background:var(--bad-bg); color:var(--bad); }
  .speak-result .heard{ font-weight:700; font-size:15px; display:block; margin-bottom:4px; color:var(--text); }
  .replay-row{ display:flex; gap:10px; margin-bottom:8px; }
  .replay-row .speaker-mini{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--brass-dim);
    background:var(--ink-panel-2); color:var(--brass-bright); font-size:16px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .complete-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; }
  .complete-seal{
    width:90px; height:90px; border-radius:50%; border:2px solid var(--brass);
    display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif;
    font-size:15px; color:var(--brass-bright); margin-bottom:18px; box-shadow:0 0 0 5px rgba(224,138,52,.10);
  }
  .complete-title{ font-family:'Shippori Mincho',serif; font-size:19px; margin-bottom:6px; }
  .complete-score{ font-family:'Spectral',serif; font-size:36px; color:var(--brass-bright); margin:10px 0 4px; }
  .complete-meta{ font-size:12px; color:var(--text-mute); margin-bottom:26px; }
  .complete-actions{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; }

  footer.credit{ text-align:center; font-size:10px; color:var(--text-mute); opacity:.6; padding:18px 0 4px; letter-spacing:.05em; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,9,6,.7); z-index:50; display:none; align-items:flex-end; justify-content:center; }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    width:100%; max-width:640px; background:var(--ink-panel); border-top:1px solid var(--brass-dim);
    border-radius:14px 14px 0 0; padding:22px 22px 28px; animation:slideUp .25s ease;
  }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal-title{ font-family:'Shippori Mincho',serif; font-size:17px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; }
  .modal-title .close-x{ cursor:pointer; color:var(--text-mute); font-size:18px; }
  .setting-row{ margin-bottom:20px; }
  .setting-label{ font-size:12px; color:var(--text-mute); margin-bottom:8px; display:flex; justify-content:space-between; }
  .setting-label span.val{ color:var(--brass-bright); font-family:'Spectral',serif; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:2px; background:var(--hairline); outline:none; }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--brass); cursor:pointer; border:2px solid var(--text);
  }
  select.voice-select{
    width:100%; background:var(--ink-panel-2); color:var(--text); border:1px solid var(--hairline);
    border-radius:5px; padding:10px 12px; font-size:13px; font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .speed-presets{ display:flex; gap:8px; margin-top:10px; }
  .speed-presets button{
    flex:1; background:var(--ink-panel-2); border:1px solid var(--hairline); color:var(--text-mute);
    border-radius:5px; padding:8px 4px; font-size:11px; cursor:pointer;
  }
  .speed-presets button.active{ border-color:var(--brass); color:var(--brass-bright); }
  .voice-warn{ font-size:11px; color:var(--text-mute); margin-top:8px; line-height:1.6; }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark">活</span>
      <div style="min-width:0;">
        <div class="name" id="brandName">にほんご活字堂</div>
        <div class="sub" id="brandSub">JAPANESE FOR FILIPINOS · 120Q</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="lang-toggle">
        <button id="langTlBtn" class="active">TL</button>
        <button id="langEnBtn">EN</button>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Voice settings">⚙</button>
      <button class="back-btn" id="headerBackBtn" style="display:none;"></button>
    </div>
  </header>

  <!-- HOME -->
  <section class="screen active" id="screen-home">

    <div class="stage-selector" id="stageSelector"></div>

    <div class="hero">
      <div class="eyebrow" id="heroEyebrow">5-STEP NA PARAAN</div>
      <h1 id="heroTitle">Simulan ang Nihongo<br>mula sa mismong ugat.</h1>
      <p id="heroDesc"></p>
    </div>

    <div class="weak-cta" id="weakCta" style="display:none;">
      <div>
        <div class="wl-title" id="weakTitle">Weak Point Review</div>
        <div class="wl-sub" id="weakSub">Balikan lang ang mga tanong na na-miss mo</div>
      </div>
      <div class="wl-count" id="weakCount">0</div>
    </div>

    <div class="unit-list" id="unitList"></div>

    <footer class="credit">EdTech Nihongo family · Yoshida EdTech Works</footer>
  </section>

  <!-- LESSON -->
  <section class="screen" id="screen-lesson">
    <div class="q-unit-tag" id="lessonUnitTag"></div>
    <div class="lesson-progress" id="progressDots"></div>

    <!-- STEP 1 -->
    <div id="step1" class="step-pane">
      <div class="step-label" id="step1Label">STEP 1</div>
      <div class="listen-stage">
        <button class="speaker-btn" id="playBtn">▶</button>
        <div class="listen-hint" id="listenHint"></div>
        <div class="listen-count" id="listenCount"></div>
      </div>
      <button class="primary-btn" id="toStep2Btn" disabled></button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step-pane" style="display:none;">
      <div class="step-label" id="step2Label">STEP 2</div>
      <div class="blank-sentence" id="blankSentence"></div>
      <div class="choice-list" id="choiceList"></div>
    </div>

    <!-- STEP 3 -->
    <div id="step3" class="step-pane" style="display:none;">
      <div class="step-label" id="step3Label">STEP 3</div>
      <div class="assembly-line" id="assemblyLine"></div>
      <div class="assembly-caption" id="assemblyCaption"></div>
      <div class="type-pool" id="typePool"></div>
      <button class="ghost-btn" id="resetChunksBtn"></button>
    </div>

    <!-- STEP 4 -->
    <div id="step4" class="step-pane" style="display:none;">
      <div class="step-label" id="step4Label">STEP 4</div>
      <div class="reveal-card">
        <div class="replay-row">
          <button class="speaker-mini" id="replayBtn">▶</button>
        </div>
        <div class="reveal-jp jp" id="revealJp"></div>
        <div class="reveal-romaji romaji" id="revealRomaji"></div>
        <div class="reveal-meaning" id="revealMeaning"></div>
        <div class="reveal-tip" id="revealTip"></div>
        <div class="speak-check" id="speakCheck">
          <button class="mic-btn" id="micBtn">🎤</button>
          <div class="speak-status" id="speakStatus"></div>
          <div class="speak-result" id="speakResult" style="display:none;"></div>
        </div>
      </div>
      <button class="primary-btn" id="nextQBtn"></button>
    </div>
  </section>

  <!-- UNIT COMPLETE -->
  <section class="screen" id="screen-complete">
    <div class="complete-wrap">
      <div class="complete-seal" id="completeSealText">済</div>
      <div class="complete-title" id="completeUnitName"></div>

n. Binubuo ng 'E' (え) at 'Ki' (き).", "chunks": ["え", "き"], "options": ["えき", "えぎ", "いき"], "correct": 0, "unit": 1}, {"id": "s1_u01_q08", "target_ja": "かく", "romaji": "Kaku", "tl_meaning": "Magsulat", "en_meaning": "To write", "tip_tl": "Pangunahing pandiwa sa trabaho at pag-aaral. 'Ka' (か) na sinusundan ng 'Ku' (く).", "chunks": ["か", "く"], "options": ["かく", "かぐ", "かっく"], "correct": 0, "unit": 1}, {"id": "s1_u01_q09", "target_ja": "きく", "romaji": "Kiku", "tl_meaning": "Makinig / Magtanong", "en_meaning": "To listen / To ask", "tip_tl": "Kombinasyon ng 'Ki' (き) at 'Ku' (く). Siguraduhing malinaw ang bawat titik at walang dakuten.", "chunks": ["き", "く"], "options": ["きく", "きぐ", "ぎく"], "correct": 0, "unit": 1}, {"id": "s1_u01_q10", "target_ja": "おおきい", "romaji": "Ookii", "tl_meaning": "Malaki", "en_meaning": "Big / Large", "tip_tl": "May mahabang tunog na 'O' (おお). Sa pagsulat, dalawang 'O' (お) ang ginagamit bago ang 'Ki' (き) at 'I' (い).", "chunks": ["おお", "きい"], "options": ["おおきい", "おきい", "おおぎい"], "correct": 0, "unit": 1}, {"id": "s1_u01_q11", "target_ja": "あけて", "romaji": "Akete", "tl_meaning": "Pakibuksan", "en_meaning": "Please open", "tip_tl": "Madalas gamitin sa utos tulad ng 'Mado wo akete' (Pakibuksan ang bintana). Binubuo ng 'A' (あ) at 'Ke' (け).", "chunks": ["あ", "け", "て"], "options": ["あけて", "あげて", "あきて"], "correct": 0, "unit": 1}, {"id": "s1_u01_q12", "target_ja": "ここにいく", "romaji": "Koko ni iku", "tl_meaning": "Pupunta rito", "en_meaning": "Go here", "tip_tl": "Maikling parirala na gumagamit ng 'Ko' (こ) at 'Iku' (いく). Tandaan ang tamang pagkakasunod ng mga salita.", "chunks": ["ここ", "に", "いく"], "options": ["ここにいく", "ごごにいく", "ここにいぐ"], "correct": 0, "unit": 1}, {"id": "s1_u03_q01", "target_ja": "はな", "romaji": "Hana", "tl_meaning": "Bulaklak / Ilong", "en_meaning": "Flower / Nose", "tip_tl": "Ang 'Hana' ay walang boses sa unang pantig. Mag-ingat na huwag sabihing 'Bana' dahil nag-iiba ang tunog ng H at B.", "chunks": ["は", "な"], "options": ["はな", "ばな", "ぱな"], "correct": 0, "unit": 3}, {"id": "s1_u03_q02", "target_ja": "ばなな", "romaji": "Banana", "tl_meaning": "Saging", "en_meaning": "Banana", "tip_tl": "May dakuten (テンテン) ang 'Ba' (ば). Kapag walang dakuten, ito ay mababasa bilang 'Hana' na iba ang kahulugan.", "chunks": ["ば", "な", "な"], "options": ["ばなな", "はなな", "ぱなな"], "correct": 0, "unit": 3}, {"id": "s1_u03_q03", "target_ja": "みず", "romaji": "Mizu", "tl_meaning": "Tubig", "en_meaning": "Water", "tip_tl": "Napakaimportanteng salita sa trabaho. Ang 'Zu' (ず) ay may dakuten mula sa 'Su' (す). Kapag sinabi mong 'Misu', hindi ka maiintindihan.", "chunks": ["み", "ず"], "options": ["みず", "みす", "みつ"], "correct": 0, "unit": 3}, {"id": "s1_u03_q04", "target_ja": "かざ", "romaji": "Kaza", "tl_meaning": "Hangin (sa mga tambalang salita tulad ng Kazamuki)", "en_meaning": "Wind (in compound words)", "tip_tl": "Ang 'Za' (ざ) ay nanggaling sa 'Sa' (さ) na nilagyan ng dakuten. Tiyaking malinaw ang pagbigkas ng 'Z' sound.", "chunks": ["か", "ざ"], "options": ["かざ", "かさ", "かた"], "correct": 0, "unit": 3}, {"id": "s1_u03_q05", "target_ja": "かさ", "romaji": "Kasa", "tl_meaning": "Payong", "en_meaning": "Umbrella", "tip_tl": "Walang dakuten ang 'Sa' (さ). Kapag nilagyan mo ng dakuten at naging 'Kaza', mag-iiba ang ibig sabihin nito.", "chunks": ["か", "さ"], "options": ["かさ", "かざ", "かだ"], "correct": 0, "unit": 3}, {"id": "s1_u03_q06", "target_ja": "かど", "romaji": "Kado", "tl_meaning": "Kanto / Sulok", "en_meaning": "Corner", "tip_tl": "Ang 'Do' (ど) ay galing sa 'To' (と). Ginagamit ito sa pagtuturo ng direksyon sa trabaho tulad ng 'kado wo magaru' (lumiko sa kanto).", "chunks": ["か", "ど"], "options": ["かど", "かと", "かね"], "correct": 0, "unit": 3}, {"id": "s1_u03_q07", "target_ja": "まど", "romaji": "Mado", "tl_meaning": "Bintana", "en_meaning": "Window", "tip_tl": "Tandaan ang 'Do' (ど) sa dulo. Madalas itong gamitin sa utos na 'Mado wo akete' (Buksan ang bintana).", "chunks": ["ま", "ど"], "options": ["まど", "まと", "まぞ"], "correct": 0, "unit": 3}, {"id": "s1_u03_q08", "target_ja": "さかな", "romaji": "Sakana", "tl_meaning": "Isda", "en_meaning": "Fish", "tip_tl": "Ang 'Sa' (さ) ay walang dakuten. Siguraduhing 'Sa' at hindi 'Za' ang mabibigkas para maging malinaw ang salita.", "chunks": ["さ", "か", "な"], "options": ["さかな", "ざかな", "たかな"], "correct": 0, "unit": 3}, {"id": "s1_u03_q09", "target_ja": "ひだり", "romaji": "Hidari", "tl_meaning": "Kaliwa", "en_meaning": "Left", "tip_tl": "May dalawang mahalagang tunog: 'Hi' (ひ) at 'Da' (だ). Kapag napalitan ang 'Da' ng 'Ta', magiging mali ang pagtuturo mo ng direksyon.", "chunks": ["ひ", "だ", "り"], "options": ["ひだり", "ひたり", "びだり"], "correct": 0, "unit": 3}, {"id": "s1_u03_q10", "target_ja": "ふね", "romaji": "Fune", "tl_meaning": "Bangka / Bapor", "en_meaning": "Ship / Boat", "tip_tl": "Ang 'Fu' (ふ) ay kabilang sa Ha-row (は行). Kapag nilagyan ng dakuten, ito ay nagiging 'Bu' (ぶ) tulad sa 'Bune'.", "chunks": ["ふ", "ね"], "options": ["ふね", "ぶね", "ぷね"], "correct": 0, "unit": 3}, {"id": "s1_u03_q11", "target_ja": "あし", "romaji": "Ashi", "tl_meaning": "Paa / Binti", "en_meaning": "Foot / Leg", "tip_tl": "Walang dakuten ang 'Shi' (し). Napakahalaga ng salitang ito sa pang-araw-araw na buhay.", "chunks": ["あ", "し"], "options": ["あし", "あじ", "あち"], "correct": 0, "unit": 3}, {"id": "s1_u03_q12", "target_ja": "あじ", "romaji": "Aji", "tl_meaning": "Lasa", "en_meaning": "Taste / Flavor", "tip_tl": "May dakuten ang 'Ji' (じ) na galing sa 'Shi' (し). Magkaibang-magkaiba ang 'Ashi' (paa) at 'Aji' (lasa) kaya mag-ingat sa pagbigkas.", "chunks": ["あ", "じ"], "options": ["あじ", "あし", "あぢ"], "correct": 0, "unit": 3}, {"id": "s1_u02_q01", "target_ja": "はい", "romaji": "Hai", "tl_meaning": "Opo / Yes", "en_meaning": "Yes", "tip_tl": "Pinakamahalagang tugon sa workplace kapag tinawag ka o may utos ang boss. Bigkasin nang maikli at malinaw, huwag pahabain.", "chunks": ["は", "い"], "options": ["はい", "ばい", "ぱい"], "correct": 0, "unit": 2}, {"id": "s1_u02_q02", "target_ja": "いいえ", "romaji": "Iie", "tl_meaning": "Hindi / No", "en_meaning": "No", "tip_tl": "Tugon kapag sumasagot ng negatibo. Mag-ingat sa spelling at bigkas dahil may dalawang 'I' (いい) sa unahan.", "chunks": ["い", "い", "え"], "options": ["いいえ", "いえ", "いいええ"], "correct": 0, "unit": 2}, {"id": "s1_u02_q03", "target_ja": "おはよう", "romaji": "Ohayou", "tl_meaning": "Magandang umaga (Casual)", "en_meaning": "Good morning (Casual)", "tip_tl": "Bati sa umaga para sa mga kapareho ng posisyon o malapit na katrabaho. Tandaan ang mahabang tunog na 'O' sa dulo na isinusulat bilang 'U' (う).", "chunks": ["お", "は", "よ", "う"], "options": ["おはよう", "おはよお", "おばよう"], "correct": 0, "unit": 2}, {"id": "s1_u02_q04", "target_ja": "こんにちは", "romaji": "Konnichiwa", "tl_meaning": "Magandang araw / Hello", "en_meaning": "Good afternoon / Hello", "tip_tl": "Bati mula tanghali hanggang hapon. Ang huling titik ay isinusulat gamit ang 'Ha' (は) pero binibigkas na 'Wa'.", "chunks": ["こん", "にち", "は"], "options": ["こんにちは", "こんにちわ", "ごんにちは"], "correct": 0, "unit": 2}, {"id": "s1_u02_q05", "target_ja": "ありがとう", "romaji": "Arigatou", "tl_meaning": "Salamat (Casual)", "en_meaning": "Thank you (Casual)", "tip_tl": "Simpleng pagpapasalamat sa mga katrabaho. Huwag kalimutan ang 'U' (う) sa dulo para sa tamang haba ng tunog.", "chunks": ["あ", "り", "が", "と", "う"], "options": ["ありがとう", "ありがとお", "ありかとう"], "correct": 0, "unit": 2}, {"id": "s1_u02_q06", "target_ja": "すみません", "romaji": "Sumimasen", "tl_meaning": "Excuse me / Paumanhin", "en_meaning": "Excuse me / Sorry", "tip_tl": "Ginagamit kapag may itatanong, tatawag ng pansin, o hihingi ng paumanhin sa maliit na bagay. Tiyaking 'Su' (す) at hindi 'Tsu' (つ) ang unahan.", "chunks": ["す", "み", "ま", "せ", "ん"], "options": ["すみません", "つみません", "ずみません"], "correct": 0, "unit": 2}, {"id": "s1_u02_q07", "target_ja": "おねがいします", "romaji": "Onegaishimasu", "tl_meaning": "Pakiusap po / Please", "en_meaning": "Please", "tip_tl": "Ginagamit kapag may iniutos o gustong ipakisuyo sa kapwa katrabaho o supervisor. Ang 'Ga' (が) ay may dakuten.", "chunks": ["おね", "がい", "しま", "す"], "options": ["おねがいします", "おねかいします", "おねがいちます"], "correct": 0, "unit": 2}, {"id": "s1_u02_q08", "target_ja": "どうぞ", "romaji": "Douzo", "tl_meaning": "Sige po / Here you go", "en_meaning": "Please go ahead / After you", "tip_tl": "Ginagamit kapag nag-aalok ng upuan, nagpapadaan, o nag-aabot ng gamit. Mag-ingat sa pagbigkas ng 'Zo' (ぞ) na may malinaw na Z sound.", "chunks": ["ど", "う", "ぞ"], "options": ["どうぞ", "どうそ", "とうぞ"], "correct": 0, "unit": 2}, {"id": "s1_u02_q09", "target_ja": "おつかれさまです", "romaji": "Otsukaresama desu", "tl_meaning": "Salamat sa pagtatrabaho / Magandang araw", "en_meaning": "Good work today / Hello (at workplace)", "tip_tl": "Standard na bati sa workplace kapag nakakasalubong ang mga kasamahan sa trabaho. Siguraduhing mabigkas nang tama ang 'Tsu' (つ).", "chunks": ["おつ", "かれ", "さま", "です"], "options": ["おつかれさまです", "おすかれさまです", "おちかれさまです"], "correct": 0, "unit": 2}, {"id": "s1_u02_q10", "target_ja": "おはようございます", "romaji": "Ohayou gozaimasu", "tl_meaning": "Magandang umaga po (Polite)", "en_meaning": "Good morning (Polite)", "tip_tl": "Pormal na bati sa umaga para sa mga boss, supervisor, o nakatatandang katrabaho. Ang 'Za' (ざ) ay nanggaling sa 'Sa' (さ) na may dakuten.", "chunks": ["おは", "よう", "ござい", "ます"], "options": ["おはようございます", "おはようこざいます", "おはよおございます"], "correct": 0, "unit": 2}, {"id": "s1_u02_q11", "target_ja": "ありがとうございます", "romaji": "Arigatou gozaimasu", "tl_meaning": "Maraming salamat po (Polite)", "en_meaning": "Thank you very much (Polite)", "tip_tl": "Ang pinakaligtas at pinakamagalang na paraan ng pagpapasalamat sa loob ng kumpanya o pasilidad. Sanayin ang tamang baybay ng bawat bahagi.", "chunks": ["ありが", "とう", "ござい", "ます"], "options": ["ありがとうございます", "ありがとおございます", "ありがとうこざいます"], "correct": 0, "unit": 2}, {"id": "s1_u02_q12", "target_ja": "しつれいします", "romaji": "Shitsureishimasu", "tl_meaning": "Paumanhin po (Kapag papasok o aalis)", "en_meaning": "Excuse me / Goodbye (Formal)", "tip_tl": "Ginagamit kapag papasok sa opisina ng boss, kapag lalampas sa harap ng tao, o kapag uuwi na pagkatapos ng shift. Tandaan ang kombinasyon ng 'Shi' (し) at 'Tsu' (つ).", "chunks": ["しつ", "れい", "しま", "す"], "options": ["しつれいします", "しすれいします", "ひつれいします"], "correct": 0, "unit": 2}, {"id": "s1_u04_q01", "target_ja": "すし", "romaji": "Sushi", "tl_meaning": "Sushi", "en_meaning": "Sushi", "tip_tl": "Sikat na pagkain sa Hapon. Mag-ingat sa pagbigkas ng 'Su' (す) at 'Shi' (し) para hindi magkapalit ang dalawang tunog.", "chunks": ["す", "し"], "options": ["すし", "つし", "すつ"], "correct": 0, "unit": 4}, {"id": "s1_u04_q02", "target_ja": "つき", "romaji": "Tsuki", "tl_meaning": "Buwan (Moon / Month)", "en_meaning": "Moon / Month", "tip_tl": "Ang 'Tsu' (つ) ay may tunog na 'TS'. Huwag itong bibigkasin bilang 'Su' (す) para hindi mapagkamalang ibang salita.", "chunks": ["つ", "き"], "options": ["つき", "すき", "しき"], "correct": 0, "unit": 4}, {"id": "s1_u04_q03", "target_ja": "すき", "romaji": "Suki", "tl_meaning": "Gusto / Nagustuhan", "en_meaning": "Like / Love", "tip_tl": "Dito naman ay 'Su' (す) ang simula. Ito ang katapat na salita ng naunang tanong, siguraduhing malinaw ang kaibahan ng 'Su' at 'Tsu'.", "chunks": ["す", "き"], "options": ["すき", "つき", "しき"], "correct": 0, "unit": 4}, {"id": "s1_u04_q04", "target_ja": "いす", "romaji": "Isu", "tl_meaning": "Upuan", "en_meaning": "Chair", "tip_tl": "Napakadalas gamitin sa loob ng pasilidad o opisina. Siguraduhing 'Su' (す) ang dulo at hindi 'Tsu' (つ).", "chunks": ["い", "す"], "options": ["いす", "いつ", "いし"], "correct": 0, "unit": 4}, {"id": "s1_u04_q05", "target_ja": "いつ", "romaji": "Itsu", "tl_meaning": "Kailan", "en_meaning": "When", "tip_tl": "Ginagamit sa pagtatanong ng oras o iskedyul ng shift. Magkaiba ang kahulugan ng 'Isu' (upuan) at 'Itsu' (kailan) kaya pakinggan nang mabuti.", "chunks": ["い", "つ"], "options": ["いつ", "いす", "いし"], "correct": 0, "unit": 4}, {"id": "s1_u04_q06", "target_ja": "くつ", "romaji": "Kutsu", "tl_meaning": "Sapatos", "en_meaning": "Shoes", "tip_tl": "Sa Jap , {"id": "s1_u05_q06", "target_ja": "さっか", "romaji": "Sakka", "tl_meaning": "Manunulat (Author)", "en_meaning": "Writer / Author", "tip_tl": "May katumbas na dobleng katinig sa English (kk). Isulat gamit ang maliit na 'っ' bago ang 'ka'.", "chunks": ["さっ", "か"], "options": ["さっか", "さか", "ざっか"], "correct": 0, "unit": 5}, {"id": "s1_u05_q07", "target_ja": "おと", "romaji": "Oto", "tl_meaning": "Tunog", "en_meaning": "Sound / Noise", "tip_tl": "Mabilis at banayad ang paglipat mula 'o' (お) patungong 'to' (と). Huwag lagyan ng hinto sa gitna.", "chunks": ["お", "と"], "options": ["おと", "おっと", "おど"], "correct": 0, "unit": 5}, {"id": "s1_u05_q08", "target_ja": "おっと", "romaji": "Otto", "tl_meaning": "Asawa (Husband)", "en_meaning": "Husband", "tip_tl": "May maikling pause sa pagitan ng 'o' at 'to'. Kung hindi mo isasama ang 'っ', magiging 'oto' (tunog) ang kahulugan.", "chunks": ["おっ", "と"], "options": ["おっと", "おと", "おっど"], "correct": 0, "unit": 5}, {"id": "s1_u05_q09", "target_ja": "まつ", "romaji": "Matsu", "tl_meaning": "Mag-antay / Pine tree", "en_meaning": "To wait", "tip_tl": "Pandiwa na madalas gamitin sa workplace tulad ng 'Chotto matsu' (Sandali lang). Walang dobleng katinig bago ang 'tsu'.", "chunks": ["ま", "つ"], "options": ["まつ", "まっつ", "ます"], "correct": 0, "unit": 5}, {"id": "s1_u05_q10", "target_ja": "まって", "romaji": "Matte", "tl_meaning": "Teka / Wait", "en_meaning": "Wait", "tip_tl": "Ito ang pautos na anyo ng 'matsu'. May sokuon (っ) kaya kailangang mag-pause sandali bago sabihin ang 'te'.", "chunks": ["まっ", "て"], "options": ["まって", "まて", "まっで"], "correct": 0, "unit": 5}, {"id": "s1_u05_q11", "target_ja": "ちょっと", "romaji": "Chotto", "tl_meaning": "Sandali / Kaunti", "en_meaning": "A moment / A little", "tip_tl": "Napakaraming gamit sa trabaho kapag may gustong i-hold sandali. Ang dulo ay may 'っ' bago ang 'to', mag-ingat na huwag masulat na 'choto'.", "chunks": ["ちょっ", "と"], "options": ["ちょっと", "ちよっと", "ちょと"], "correct": 0, "unit": 5}, {"id": "s1_u05_q12", "target_ja": "いってください", "romaji": "Itte kudasai", "tl_meaning": "Pakiusap sabihin / Pakipunta", "en_meaning": "Please say / Please go", "tip_tl": "May sokuon (っ) sa unang bahagi. Kung bibigkasin mo nang walang 'っ' bilang 'Ite', ang ibig sabihin nito ay 'Masakit!', kaya napakahalaga ng tamang hinto.", "chunks": ["いっ", "てく", "ださ", "い"], "options": ["いってください", "いてください", "いっでください"], "correct": 0, "unit": 5}, {"id": "s1_u06_q01", "target_ja": "おじさん", "romaji": "Ojisan", "tl_meaning": "Tiyo / Lalaking nasa gitnang edad", "en_meaning": "Uncle / Middle-aged man", "tip_tl": "Mabilis lang ang pagbigkas sa 'ji' (じ). Kapag pinalaba mo ang tunog at ginawang 'ojiisan', magiging 'lolo' ang kahulugan nito.", "chunks": ["お", "じ", "さ", "ん"], "options": ["おじさん", "おじいさん", "おちさん"], "correct": 0, "unit": 6}, {"id": "s1_u06_q02", "target_ja": "おじいさん", "romaji": "Ojiisan", "tl_meaning": "Lolo / Matandang lalaki", "en_meaning": "Grandfather / Elderly man", "tip_tl": "May mahabang tunog na 'I' (い) sa gitna. Napakahalaga nito sa caregiving para hindi mapagpalit ang lolo sa tiyo.", "chunks": ["お", "じい", "さ", "ん"], "options": ["おじいさん", "おじさん", "おじえさん"], "correct": 0, "unit": 6}, {"id": "s1_u06_q03", "target_ja": "おばさん", "romaji": "Obasan", "tl_meaning": "Tiya / Babaeng nasa gitnang edad", "en_meaning": "Aunt / Middle-aged woman", "tip_tl": "Maikli ang bawat pantig. Mag-ingat na huwag pahabain ang 'ba' para hindi maging 'lola'.", "chunks": ["お", "ば", "さ", "ん"], "options": ["おばさん", "おばあさん", "おぱさん"], "correct": 0, "unit": 6}, {"id": "s1_u06_q04", "target_ja": "おばあさん", "romaji": "Obaasan", "tl_meaning": "Lola / Matandang babae", "en_meaning": "Grandmother / Elderly woman", "tip_tl": "May mahabang tunog na 'A' (あ) sa gitna. Isinusulat ito gamit ang 'おばあさん' at hindi 'おばああさん'.", "chunks": ["お", "ばあ", "さ", "ん"], "options": ["おばあさん", "おばさん", "おばおさん"], "correct": 0, "unit": 6}, {"id": "s1_u06_q05", "target_ja": "ゆき", "romaji": "Yuki", "tl_meaning": "Niyebe", "en_meaning": "Snow", "tip_tl": "Maikli ang pagbigkas sa '
